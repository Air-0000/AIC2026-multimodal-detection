# =============================================================================
# DEIM-D-FINE-X (HGNetv2-B5) AIC 单阶段微调 -- Class-Adaptive MAL 实验
# -----------------------------------------------------------------------------
# 目的: 彻底解决 mal2 全局加倍惩罚误杀 boat (AP 0.4284->0.3650) 的缺陷,
#       同时保留对 sign/ball/garbage can/person 高频背景虚警的双倍镇压能力。
# 配置: 对 12 个类别进行差异化负样本惩罚:
#       - 虚警重灾区 (person, sign, ball, garbage can): scale = 2.0
#       - 弱光水面/高空稀缺类 (boat, uav): scale = 1.0 (温和放生)
#       - 普通类 (animal, car, bicycle, light, seat, tricycle): 1.0 ~ 1.5
# 对照: deim_hgnetv2_x_aic_obj2coco_ft_dcn.yml (DCNv2 stages [2,3])
# =============================================================================
__include__: [
  'deim_hgnetv2_x_aic_obj2coco_ft_dcn.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_obj2coco_ft_adpmal

DEIMCriterion:
  weight_dict:
    loss_mal: 1
  cls_mal_scale: [
    2.0,  # 0: person (镇压 5300+ 背景噪点)
    1.0,  # 1: boat (温和放生暗部水面真阳性, 挽救 AP)
    1.5,  # 2: animal (适度加压)
    1.0,  # 3: seat
    2.0,  # 4: sign (强力镇压窗棱反光, 挽救低分真目标)
    1.2,  # 5: bicycle
    1.5,  # 6: car
    2.0,  # 7: ball (强力镇压路面圆形反光)
    1.2,  # 8: light
    2.0,  # 9: garbage can (强力镇压路边配电箱)
    1.0,  # 10: uav (保护高空小弱目标)
    1.0   # 11: tricycle
  ]
