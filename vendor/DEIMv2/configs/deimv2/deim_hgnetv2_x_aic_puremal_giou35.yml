# =============================================================================
# DEIM-D-FINE-X (HGNetv2-B5) AIC 单阶段微调 -- 纯 MAL2 + 强化 GIoU 边框收敛实验
# -----------------------------------------------------------------------------
# 目的: 解决 AP75 从 AP50 (85.0%) 骤跌至 61.4% 的边框微抖痛点
# 优化项:
#   1. loss_giou: 从 2.0 上调至 3.5 (强化重叠度约束，压制边框抖动)
#   2. cost_giou: 匹配上调至 3.5 (让匈牙利双边匹配优先选取高 IoU 的精确定位 Query)
#   3. loss_fgl: 从 0.15 上调至 0.20 (细粒度亚像素分布边界回归强化)
#   4. loss_mal: 保持最优的 2.0 (全集海量负样本强力惩罚)
# =============================================================================
__include__: [
  'deim_hgnetv2_x_aic_obj2coco_ft.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_puremal_giou35

DEIMCriterion:
  weight_dict:
    loss_mal: 2
    loss_bbox: 5
    loss_giou: 3.5
    loss_fgl: 0.20
    loss_ddf: 1.5
  matcher:
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 3.5
