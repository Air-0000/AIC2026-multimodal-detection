# =============================================================================
# DEIM-D-FINE-X 终极合流主战蒸馏模型 (Sovereign V21 Distillation)
# 实验室科研服务器 ailab40 (双卡 Tesla V100 32GB) 专用配置
# -----------------------------------------------------------------------------
# 架构与蒸馏体系:
#   - 教师模型 (Teacher): Sovereign V20 58.5% 历史巅峰模型汤 (冻结在线蒸馏)
#     * 权威权重: /home/ailab/ssd/bigdata/liuzhengyang/weights/teacher_sovereign_v20_585.pth
#   - 学生模型 (Student): Sovereign V21 终极微小目标攻坚架构
#     * 起步热启: /home/ailab/ssd/bigdata/liuzhengyang/weights/sovereign_v14_soup.pth
#     * 6 通道物理输入: RGB(3) + Aligned IR(1) + LBG IR(1) + Depth P0(1)
#     * 五大雪藏明珠全面激活:
#       1. StarConv (微软星形乘法高阶特征交互) in HybridEncoder P4
#       2. Spatial-PBD (空间分区高度门控，y>=0.45水域歼灭散斑，陆地豁免长椅)
#       3. LMM (正交十字卷积 3x7+7x3 大核感知)
#       4. P2-CSRG+ (Haar 小波 + 11x1 纵向卷积 + CSR 门控微小目标直通)
#       5. MixStyle 跨域泛化 + 1D 导向去条纹算法
#   - 训练加速:
#     * /dev/shm/aic_cache 48GB 内存盘常驻 (0ms 物理读取延迟)
#     * 双卡分布式 DDP (Backend: Gloo, 规避 NVML 拓扑死锁)
#     * 单阶段端到端 (One-Stage End-to-End) 联合回传，严禁分阶段
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: distill
teacher_cfg: configs/deimv2/teacher_sovereign_v20_585.yml
teacher_weight: /home/ailab/ssd/bigdata/liuzhengyang/weights/teacher_sovereign_v20_585.pth
kd_temp: 2.0
kd_cls_w: 1.2
kd_box_w: 0.6
kd_conf_thresh: 0.25
find_unused_parameters: True

output_dir: ./outputs/sovereign_v21_distill_ailab40

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: True       # 内生化 3 视角高清切片推理直通
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_shallow_edge_fuse: True # 浅层高频边缘注入
  use_rfgm_edge: True         # AAAI 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 -> Stage 1 微残差直通桥
  use_mixstyle: True          # MixStyle 跨域泛化
  mixstyle_p: 0.3
  pretrained_ir_stem: True
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 160x160)
  stem_base: 64
  ir_drop_prob: 0.05
  freeze_at: 0
  freeze_norm: True
  pretrained: False

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 (P3: 80x80) 与 Level 1 (P4: 40x40) 2D-SSM
  ssm_d_state: 16
  use_p2_guidance: True       # P2 (160x160) 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控
  p2_dim: 128
  use_lfp: True               # LFP 低频引导净化
  use_pbd: True               # PBD 峰值-背景解耦 (Spatial-PBD)
  use_starconv: True          # StarConv 微软星形运算 (CVPR 2024)

DFINETransformer:
  use_snr_sharpen: True       # 暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5
  use_diam: True              # DIAM 可变形交互注意力

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 傅里叶对比正则化损失
  losses: ['mal', 'boxes', 'local', 'fcr']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.000002
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00015
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 12
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 100
flat_epoch: 6
no_aug_epoch: 2

accum_steps: 2
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 8
  num_workers: 4
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /home/ailab/ssd/bigdata/liuzhengyang/data/annotations/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 0
    mixup_epochs: [999, 999]

val_dataloader:
  type: DataLoader
  total_batch_size: 8
  num_workers: 4
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /home/ailab/ssd/bigdata/liuzhengyang/data/annotations/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 100
  decay: 0.9998
