# =============================================================================
# Sovereign V25 纯净对齐与模型级抗冗余修复 (Model-Level Repair + MidBoost)
# 算力平台: NVIDIA RTX PRO 6000 Blackwell (96GB VRAM, 600W 满血)
# 用户指令: 模型层面修复“一物多框”缺陷，同时打开 MidBoost，找回环境设施弱目标
# 核心技术创新:
#   1. 从 Sovereign V24 极夜鲁棒巅峰权重 (best_stg2.pth) 启动
#   2. 内生化 MidBoost 自适应红外照度门控 (HGNetv2MultiModal.use_midboost=True)
#   3. 编码器空间解耦选点机制 (SDQS: Spatial Diversity Query Selection):
#      - 2D 局部极大值空间池化，彻底消灭单实体/密集动物群内的 Query 扎堆与“多胞胎”
#   4. 训练端近邻冗余惩罚损失 (NDSL: Near-Duplicate Suppression Loss):
#      - 对与 GT 重叠 IoU >= 0.35 的次优副 Query 施加最高 3.5x 负向梯度惩罚，根除“一物多框”
#   5. 环境设施类 (light, sign, seat) 负样本抑制动态解冻:
#      - cls_neg_scale 降至 0.8，tadl_min_iou 降至 0.20，恢复 F5 风格真实环境设施高召回
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: detection
eval_spatial_size: [1152, 2048]
output_dir: ./outputs/sovereign_v25_model_repair_midboost_2048

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: False
  use_internal_tta: True        # 方案一：前向管线级内化 (全画幅左右对称翻转 TTA 变焦引擎)
  use_p2_cascade_zoom: True     # 方案二：特征层级级联内化 (Stage 0 P2 RoI Zoom Gate)
  p2_zoom_alpha: 0.45           # 空间高频峰值显著度放大增益 (Pure Boost, +0.70% ball, +0.27% AP_small)
  p2_zoom_thresh: 0.35          # P2 空间高频能量对比度门限
  p2_zoom_max_area: 0.025       # 专注小微目标 (面积 <= 2.5% 画布)
  p2_zoom_score_min: 0.15       # 模糊弱置信下限
  p2_zoom_score_max: 0.45       # 模糊弱置信上限
  use_frontend_naf: True        # Combo 3 前端画质修复：无激活门控块 (NAFBlock, 0.002M 参数自适应去噪去模糊)
  naf_mid_channels: 32
  naf_num_blocks: 2
  use_p2_wavelet_sr: True       # Combo 3 P2 小波超分增强核：Haar DWT + StarConv 1.25x 边缘调制
  p2_wavelet_scale: 1.25
  p2_wavelet_blend: 0.15
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_midboost: True      # 内生化 MidBoost 自适应照度门控与零失真旁路
  use_dcda: True          # DCDA 深度引导形变视客对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_shallow_edge_fuse: True # 浅层高频边缘注入
  use_rfgm_edge: True         # AAAI 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 -> Stage 1 微残差直通桥
  use_mixstyle: True          # MixStyle 跨域泛化
  mixstyle_p: 0.3
  pretrained_ir_stem: True
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 288x512)
  stem_base: 64
  ir_drop_prob: 0.10          # 骨干内 IR 特征随机丢弃 10%
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: False

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 与 Level 1 2D-SSM
  ssm_d_state: 16
  use_p2_guidance: True       # P2 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控
  p2_dim: 128
  use_lfp: True               # LFP 低频引导净化
  use_pbd: True               # PBD 峰值-背景解耦 (Spatial-PBD)
  use_starconv: True          # StarConv 微软星形运算 (CVPR 2024)

DFINETransformer:
  use_snr_sharpen: True       # 暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5
  use_diam: True              # DIAM 可变形交互注意力
  use_sdqs: False             # 从未实现（历史配置曾误以为生效）；置 True 现在会直接报错

DEIMCriterion:
  weight_dict:
    loss_tadl: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 傅里叶对比正则化损失
  losses: ['tadl', 'boxes', 'local', 'fcr']
  gamma: 1.5
  tadl_beta: 0.5
  tadl_min_iou: 0.20          # 降低最小门限，给弱小 light/sign/seat 充足梯度
  use_ndsl: True              # 近邻冗余惩罚损失 (NDSL)
  ndsl_min_iou: 0.35          # 重叠 >= 0.35 的副 Query 认定为冗余
  ndsl_factor: 2.5            # 最高 3.5x 惩罚系数
  cls_neg_scale: [1.0, 1.5, 1.0, 0.8, 0.8, 1.0, 1.0, 2.0, 0.8, 1.2, 1.5, 2.0]
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.0000003           # 骨干严格锁定 3e-7
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000010                # 纯净微调学习率 1.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 20
flat_epoch: 4
no_aug_epoch: 2

accum_steps: 1                # 96GB 显存单步吞吐
print_freq: 20
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 8
  num_workers: 8
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Mosaic, output_size: [576, 1024], rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.7, 1.3],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1152, 2048]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomRGBDegrade5ch, p: 0.5, brightness: [0.005, 0.80], contrast: [0.20, 0.90], noise_std: [0.02, 0.12], log_brightness: True}
        - {type: RandomModalityFailure, p_rgb: 0.15, p_ir: 0.10, p_depth: 0.15}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
      policy:
        name: stop_epoch
        epoch: 6              # 倒数 2 个 epoch 关闭重度几何增广
        ops:
          - {type: Resize, size: [1152, 2048]}
          - {type: SanitizeBoundingBoxes, min_size: 1}
          - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
      mosaic_prob: 0.5
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2048
    base_size_repeat: ~
    mixup_prob: 0.5
    mixup_epochs: [2, 6]
    copyblend_prob: 0.5
    copyblend_epochs: [2, 6]
    stop_epoch: 6

val_dataloader:
  type: DataLoader
  total_batch_size: 8
  num_workers: 4
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1152, 2048]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

