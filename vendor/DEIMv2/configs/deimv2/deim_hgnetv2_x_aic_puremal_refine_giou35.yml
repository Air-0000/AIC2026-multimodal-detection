# =============================================================================
# DEIM-D-FINE-X AIC 快速边界精炼 (Clean Boundary Refinement, 8 Epochs)
# -----------------------------------------------------------------------------
# 起点: outputs/deim_hgnetv2_x_aic_obj2coco_ft_puremal/best_stg2.pth (当前 0.5671 最优模型)
# 针对性升级:
#   1. 批量加速: micro-batch 从 4 提至 8 (accum_steps: 2, batch: 16), 提速 2 倍
#   2. 学习率温和平滑: lr = 5e-6 (主干 5e-7), 贴合初训收敛的 2.5e-6, 绝无梯度冲击
#   3. 真正纯净单图训练: 彻底移除 Mosaic/Crop, 仅保留 Resize+Flip
#   4. 边框收紧: loss_giou=3.0 / cost_giou=3.0 / loss_fgl=0.18 / loss_mal=2.0
# =============================================================================
__include__: [
  'deim_hgnetv2_x_aic_puremal_giou35.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_puremal_refine_giou35

epoches: 8
no_aug_epoch: 0
checkpoint_freq: 2
accum_steps: 2

## 平滑微调学习率 (微调级 5e-6，保护已学到的 0.5671 高分特征)
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000005
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

DEIMCriterion:
  weight_dict:
    loss_mal: 2
    loss_bbox: 5
    loss_giou: 3.0
    loss_fgl: 0.18
    loss_ddf: 1.5
  matcher:
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 3.0

## EMA 快速紧贴
ema:
  warmups: 50

## 纯净原生图像训练 (无任何 Mosaic 拼接扰动)
train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    mixup_prob: 0.0
    mixup_epochs: [999, 999]
    stop_epoch: 999
    base_size_repeat: 1

val_dataloader:
  total_batch_size: 8
