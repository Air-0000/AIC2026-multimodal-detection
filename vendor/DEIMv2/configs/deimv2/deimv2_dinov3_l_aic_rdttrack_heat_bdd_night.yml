__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# BDD100K Nighttime -- 5ch model probed with MISSING aux.
# =============================================================================
# Diagnostic only: BDD100K has no infrared and no depth, so the IR/heat and
# depth channels are fed all-black (data_aux/BDD100K/{ir_null,depth_null}).
# Comparing this against the RGB-only 3ch run on the same data quantifies how
# much our multimodal model *depends* on the aux modalities -- it was trained
# with ir_drop_prob/depth_drop_prob = 0.15, so it has seen nulled aux, but never
# for a whole evaluation set.
# Run: python train.py -c <this> -r outputs/deimv2_dinov3_l_aic_rdttrack_heat/best_stg2.pth \
#                       --use-amp --test-only
output_dir: ./outputs/deimv2_dinov3_l_aic_rdttrack_heat_bdd_night

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  unfreeze_rgb_stages: 0

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/ir_null
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/depth_null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_night.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

DEIMCriterion:
  matcher:
    matcher_change_epoch: 40
