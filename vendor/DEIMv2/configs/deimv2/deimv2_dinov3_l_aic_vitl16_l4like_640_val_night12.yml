__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# vitl16 l4like -- 单段 from-scratch, 除 RGB backbone 外与 midboost_l4 完全一致
# -----------------------------------------------------------------------------
# 模板 = deimv2_dinov3_l_aic_rdttrack_heat_night_log_rnight_ufall_x_deepir_midboost_l4.yml
# 改动仅 backbone 相关三项:
#   1. name: dinov3_vits16plus -> dinov3_vitl16   (RGB 主干 12 层 -> 24 层 1024d)
#   2. aux_name: dinov3_vits16plus (显式钉死; l4 中 aux=name=vits16plus,
#      换 ViT-L 后必须显式声明, 否则 aux 会跟着变成 ViT-L)
#   3. interaction_indexes: [5,8,11] -> [11,17,23] (24 层的对应注入层)
# 其余与 l4 逐字一致: 640 分辨率 / batch 10 (accum2 micro5) / 50ep flat25 /
# warmup 400 / no_aug 3 / RGB lr 3e-5 / ir-depth lr 1.5e-4 / unfreeze_rgb_stages: 2 /
# 光度增强 p0.8 (0.6-1.4) / night 均匀采样 level [0.005,0.45] / drop 0.15 / instance norm。
# ⚠ LLRD 对齐: l4 训练时 LLRD 代码尚不存在 (yml 组平 lr 3e-5 生效); 当前代码在
#   unfreeze_rgb_stages>0 时必走 LLRD 且默认 2e-5/0.85 (multimodal_backbones.py:1254)。
#   为复现 l4 的真实 RGB lr, 显式写 llrd_top_lr 3e-5 + llrd_decay 1.0 (平化)。
# 初始化: -t ckpts/dinov3/vitl16_rdttrack_scratch_full.pth
#   (官方 DINOv3 ViT-L RGB + ViT-S+ IR/Depth 主干, 头/融合随机 = scratch 口径)
# =============================================================================
output_dir: ./outputs/vitl16_l4like_640_eval/night12

freeze_bn: false
# ⚠ accum_steps 2->5: ViT-L @640 micro5 OOM (15.46GiB 卡), micro2 可跑;
#   有效 batch 仍 = total 10, 梯度累积数学等价, lr 不变。
accum_steps: 5
use_ema: True

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vitl16
  aux_name: dinov3_vits16plus
  weights_path: null
  interaction_indexes: [11, 17, 23]
  conv_inplane: 32
  hidden_dim: 256
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  depth_in_chans: 1
  ir_in_chans: 2
  unfreeze_rgb_stages: 2
  # 复现 l4 的平 lr 3e-5 (l4 训练时无 LLRD 代码, 见头注释)
  llrd_top_lr: 3.0e-5
  llrd_decay: 1.0
  input_norm: instance

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37

DEIMTransformer:
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  num_layers: 6
  eval_idx: -1
  dim_feedforward: 2048

## DEIM LR-Scheduler (longer: 50ep gives photometric adaptation room)
epoches: 50
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 400
flat_epoch: 25
no_aug_epoch: 3

## Optimizer (unchanged from v1)
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:ir_dinov3|depth_dinov3))(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00003
    -
      params: '^(?=.*.dinov3)(?!.*(?:ir_dinov3|depth_dinov3))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00003
      weight_decay: 0.
    -
      params: '^(?=.*(?:ir_dinov3|depth_dinov3))(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00015
    -
      params: '^(?=.*(?:ir_dinov3|depth_dinov3))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00015
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## Tri-modal dataset -- only the photometric op is strengthened vs v1
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModalCached
    cache_img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deepir_cache/train
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.005, 0.45], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}  # same mid oversample as v1
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 8
  drop_last: True
  total_batch_size: 10

  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night12
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

## DEIM Loss
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
