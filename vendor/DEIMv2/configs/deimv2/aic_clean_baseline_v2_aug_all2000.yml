# Clean baseline v1 + strong augmentation, batch 4, all 2000 labelled images (train 1800 + valid 200).
# Only these differ from aic_clean_baseline_v1.yml: train ann_file (merged by scripts/prep/merge_coco_splits.py),
# train transforms (Mosaic / RandomPhotometricDistort5ch on RGB only / RandomZoomOut / RandomIoUCrop, V27 parameters
# scaled to 1440x2560), mixup in the collate, total_batch_size 4 (accum_steps 1), train num_workers 5 with
# prefetch_factor 1 and persistent_workers false, and the step-counted settings rescaled from 900 to 500 steps per
# epoch so they cover the same number of epochs as in v1: ema.decay, ema.warmups, warmup_iter.
# Batch 4 and 5 workers fit the seeta node's 2 GB /dev/shm: a batch is ~0.35 GB, so even if every worker finishes at
# once at an epoch start the shared memory holds ~1.8 GB. With a larger /dev/shm, batch 8 / 12 workers is possible.
# persistent_workers must stay false: the epoch-gated policy (Compose stop_epoch) and the mixup window run in the
# worker processes, and persistent workers keep the epoch they were created with, so the augmentation would never
# switch on. ema_restart_decay is left as in v1 because fit_clean never restarts the EMA. Collate multi-scale stays
# off: BatchImageCollateFunction resizes to square sizes with nearest interpolation, which would squash 16:9 inputs.
# The 200 validation images are part of training here, so per-epoch validation and best.pth are not held-out;
# use final.pth. Effective batch = total_batch_size; accum_steps only splits it into micro-batches.
task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 12
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: ../../dataset/train/visible
    ann_file: ../../work_dir/deimv2_dataset/all2000/annotations/instances_all2000.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size:
        - 720
        - 1280
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.7
        - 1.3
        probability: 1.0
        fill_value: 0
        use_cache: true
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort5ch
        p: 0.5
        brightness:
        - 0.8
        - 1.2
        contrast:
        - 0.8
        - 1.2
        saturation:
        - 0.8
        - 1.2
        hue:
        - -0.05
        - 0.05
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 1440
        - 2560
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.229
        - 0.224
        - 0.225
        - 0.5
        - 0.5
        - 0.5
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 2
        - 30
        - 46
        ops:
        - Mosaic
        - RandomPhotometricDistort5ch
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
    ir_folder: ../../dataset/train/infrared_aligned
    raw_ir_folder: ../../work_dir/train_lbg_ir
    depth_folder: ../../dataset/train/depth
    depth_read: raw16
    destripe_ir: true
    n_channels: 6
    remap_mscoco_category: false
    depth_mode: raw
    strict_inputs: true
  shuffle: true
  num_workers: 5
  prefetch_factor: 1
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2560
    base_size_repeat: null
    stop_epoch: 46
    ema_restart_decay: 0.9998
    mixup_prob: 0.5
    mixup_epochs:
    - 2
    - 30
  total_batch_size: 4
  persistent_workers: false
  pin_memory: true
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: ../../dataset/train/visible
    ann_file: ../../work_dir/deimv2_dataset/valid/annotations/instances_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 1440
        - 2560
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        - 0.5
        - 0.5
        - 0.5
        std:
        - 0.229
        - 0.224
        - 0.225
        - 0.5
        - 0.5
        - 0.5
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
    ir_folder: ../../dataset/train/infrared_aligned
    raw_ir_folder: ../../work_dir/train_lbg_ir
    depth_folder: ../../dataset/train/depth
    depth_read: raw16
    destripe_ir: true
    n_channels: 6
    remap_mscoco_category: false
    depth_mode: raw
    strict_inputs: true
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
    stop_epoch: 46
    base_size: 2560
    base_size_repeat: null
  total_batch_size: 1
  persistent_workers: true
print_freq: 20
output_dir: outputs/aic_clean_baseline_v2_aug_all2000
checkpoint_freq: 5
sync_bn: false
find_unused_parameters: true
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.99982
  warmups: 556
  start: 0
epoches: 50
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*dinov3_distiller).*$
    lr: 0.0001
  - params: ^(?=.*ir_align).*$
    lr: 0.0001
  - params: ^(?=.*co_aux_head).*$
    lr: 0.0001
  - params: ^(?=.*(?:ir_stem|ir_proj|occlusion_gate|coord_lift|p2_refinement|s0_to_p3_trunk))(?!.*(?:norm|bn)).*$
    lr: 0.0001
  - params: ^(?=.*(?:score_head|class_embed)).*$
    lr: 0.00025
  - params: ^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*dinov3_distiller|.*s0_to_p3_trunk).*$
    lr: 5.0e-06
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 8.0e-05
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.000125
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 1440
- 2560
DEIM:
  backbone: HGNetv2MultiModal
  encoder: HybridEncoder
  decoder: DFINETransformer
  use_scene_gate: false
  use_internal_sahi: false
  use_internal_tta: false
  use_p2_cascade_zoom: false
  use_planar_rigidity_gate: false
  num_classes: 12
  num_queries: 300
  use_dinov3_distill: true
  dinov3_teacher_path: ckpts/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  distill_cos_weight: 1.0
  distill_gram_weight: 0.5
  distill_downsample_scale: 0.5
  use_co_aux: true
  co_aux_loss_weight_cls: 1.0
  co_aux_loss_weight_reg: 2.0
  require_teacher_weights: true
  teacher_weights_sha256: 8aa4cbddda325040fc78db2c272754af6ebe8ff2c55f6ec4f1964d8890f66035
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 56
