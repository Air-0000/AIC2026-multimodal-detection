# =============================================================================
# DEIM-D-FINE-X 终极主战全功能多模态主干网络 V2 (Sovereign Multimodal V2)
# NVIDIA RTX PRO 6000 Blackwell (96GB VRAM) 专享
# -----------------------------------------------------------------------------
# 架构配置:
#   - 基础主干: HGNetv2-B5 (RGB) + ModalityStem (2ch IR)
#   - 模态通道:
#     * Ch 0-2: Visible RGB 原彩图像
#     * Ch 3:   train_aligned_ir (3阶段高精亚像素仿射+ECC+光流对齐)
#     * Ch 4:   train_lbg_ir (31x31 中值 Top-Hat 局部背景抑制热源流)
#     * Ch 5:   16-bit 真实毫米物理深度图 P0 (0-19999mm)
#   - 三大最新优化架构 (全部 Zero-init 保证 Step 0 无损继承):
#     1. [DynGate]  动态模态置信度门控 (10µs 物理信噪比/对比度动态自适应)
#     2. [S0_Edge]  Stage 1 (160x160) 浅层高频边缘注入 (红外高通+深度视差跳变直接喂入微小目标)
#     3. [Pretrained-IR] ImageNet 预训练边缘卷积核迁移 (冷启动零震荡)
#   - 固化几何增强:
#     * DCDA: 深度引导形变视差对齐
#     * DOG: 深度阶跃遮挡隔离门控
#     * 3D-Lift: 3D 物理空间坐标升维
#     * Bilateral-Pool: 视差双边抗混叠池化模块
#   - 剔除项:
#     * 彻底剔除错位的 Query-level Logit KD (阻断 22.0 伪监督噪声)
#   - 数据管线:
#     * /dev/shm 内存盘 (0.2ms 物理读取)
#     * num_workers: 16, persistent_workers: True, pin_memory: True
#   - 起点热启:
#     * 预训练起点: outputs/deim_hgnetv2_x_aic_dog_mm/best_stg1.pth (56.18% 纯净成果)
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_sovereign_v2_rtx6000

DEIM:
  backbone: HGNetv2MultiModal

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_dynamic_gating: False   # 【安全锁定】坚决关闭动态门控，杜绝模态塌陷与权重退化
  use_shallow_edge_fuse: True # 【新特性 1】Stage 1 (160x160) 浅层高频边缘注入 (物理Sobel零初始残差)
  pretrained_ir_stem: True    # 【新特性 2】ImageNet RGB 预训练核迁移赋权 IR Stem (开局即有边缘检测能力)
  stem_base: 64
  ir_drop_prob: 0.10
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

optimizer:
  params:
    -
      params: '^(?=.*backbone\.(?:ir_|occlusion_|coord_|ir_align|dynamic_gating|shallow_edge_fuse))'
      lr: 0.00015
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*ir_)(?!.*occlusion_)(?!.*coord_)(?!.*ir_align)(?!.*dynamic_gating)(?!.*shallow_edge_fuse).*$'
      lr: 0.0000015
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00015
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 24
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 50
flat_epoch: 12000
no_aug_epoch: 4

accum_steps: 1
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 16
  num_workers: 16
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True       # 1D 导向去条纹算法
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [0, 0]      # 彻底关闭全图重叠 Mixup, 杜绝双图混叠
    stop_epoch: 20
    copyblend_epochs: [2, 20] # 保留局部微小目标 CopyBlend
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  num_workers: 8
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 100
lr_warmup_scheduler:
  warmup_duration: 0
