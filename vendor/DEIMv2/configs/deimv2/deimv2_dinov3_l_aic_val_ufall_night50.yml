__include__: [
  "../dataset/aic_detection.yml",
  "../runtime.yml",
  "../base/dataloader.yml",
  "../base/optimizer.yml",
  "../base/deimv2.yml",
]

# LEVER4 ufall 5ch裸深度底座 各挡位评测(与3ch RGB同协议 batch1 smoke, 不带cssa门控)。
output_dir: ./outputs/deimv2_dinov3_l_aic__ufall_night50

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  depth_in_chans: 1
  unfreeze_rgb_stages: 12
  input_norm: instance

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night50
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 5
    depth_mode: raw
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: "cxcywh", normalize: True}
  shuffle: False
  num_workers: 2
  drop_last: False
  total_batch_size: 1

DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
