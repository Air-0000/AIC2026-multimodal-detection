__include__:
  - '../dataset/aic_detection.yml'
  - '../runtime.yml'
  - '../base/dataloader.yml'
  - '../base/optimizer.yml'
  - '../base/deimv2.yml'

__include__:
- ../dataset/aic_detection.yml
- ../runtime.yml
- ../base/dataloader.yml
- ../base/optimizer.yml
- ../base/deimv2.yml
output_dir: ./outputs/deimv2_dinov3_l_aic_nightsim_inorm_bdd_night_val_baseline
DEIM:
  backbone: DINOv3STAs
DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes:
  - 5
  - 8
  - 11
  finetune: true
  conv_inplane: 32
  hidden_dim: 224
HybridEncoder:
  in_channels:
  - 224
  - 224
  - 224
  hidden_dim: 224
  dim_feedforward: 896
DEIMTransformer:
  feat_channels:
  - 224
  - 224
  - 224
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      ops: null
  shuffle: true
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_night_val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 16
DEIMCriterion:
  matcher:
    matcher_change_epoch: 40
