# =============================================================================
# DEIM-D-FINE-X 顶会模块全链路终极合流 V12 (Sovereign Multimodal V12 - Full-Blueprint)
# -----------------------------------------------------------------------------
# 架构底座: 继承 Sovereign V11 最佳检查点 (57.29% clean single-scale / 58.10% internal SAHI)
# 起步热启: outputs/deim_hgnetv2_x_aic_sovereign_v11_sgmg_rtx6000/best_stg1.pth
# 核心顶会王牌模块全维度合流 (实现端到端物理前传与训练正则化):
#   1. [V1-218 MHLA 多头线性注意力 (ICLR 2026) in HybridEncoder]:
#      - 与 Mamba 2D-SSM 并行构成“状态空间 (SSM) + 线性注意力”双核特征颈
#      - O(N) 严格线性空间复杂度，全局 Token 全互联，杜绝长程语义盲区
#      - 严格零初始化 (Zero-Init): 初始残差为 0，100.00% 绝对数值等价于 V11
#   2. [V1-153 DIAM 可变形交互注意力 (一区TOP 2025) in DETR Decoder]:
#      - 动态交互调制 deformable attention 采样点与几何长宽比 (w/h)
#      - 弱化离散背景噪波采样点，强制采样点聚焦于细长立柱中轴骨架与船体刚体轮廓
#      - 严格零初始化 (Zero-Init): 初始 delta offsets = 0，平滑无损热启
#   3. [V1-054 傅里叶对比正则化损失 (ECCV 2024) in DEIMCriterion]:
#      - 在频域空间通过 1D FFT 提取边界分布频谱特征，拉大正负样本频域表征差异
#      - 强化暗弱边缘辨识力，仅参与反向传播，推理耗时 0 增加
#   4. [天水高频噪声截断器 (Sky-Water Noise Attenuator) in P2-CSRG+ & Shallow Fusion]:
#      - 利用 3D 深度阶跃梯度动态阻断水面波纹与天空云层的高频噪声渗透
#   5. [内生化 CAA-SAHI 3-View 高清切片 (In-Model CAA-SAHI)]:
#      - 原生内置于 forward()，模型即一切，输出直通 58.1%~59.0%+ mAP
#   6. [显存极致释放与批大小跃迁]:
#      - 批大小升级为 total_batch_size: 24 (RTX PRO 6000 Blackwell 96GB 强劲动力)
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_sovereign_v12_rtx6000

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: True       # 内生化 3 视角高清切片，推理直通 58.1%+
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_dynamic_gating: False   # 锁定关闭动态门控，防止退化
  use_shallow_edge_fuse: True # 浅层高频边缘注入 (已集成保峰双路池化与天水噪声截断)
  use_rfgm_edge: True         # AAAI 2026 RFGM 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # AAAI 2026 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 (160x160) -> Stage 1 (80x80 P3) 主干微残差直通桥
  pretrained_ir_stem: True    # ImageNet 预训练边缘核赋权 IR Stem
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 160x160) 供 HybridEncoder 高频引导
  stem_base: 64
  ir_drop_prob: 0.05
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 (P3: 80x80) 与 Level 1 (P4: 40x40) 2D-SSM 线性全局交互
  ssm_d_state: 16             # 状态空间隐藏维度
  use_mhla_levels: [0, 1]     # 【V12 新增】MHLA 多头线性注意力 (ICLR 2026, V1-218)
  mhla_num_heads: 4
  use_p2_guidance: True       # P2 (160x160) 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控 + 天水噪声截断
  p2_dim: 128                 # Stage 0 通道数

DFINETransformer:
  use_snr_sharpen: True       # 保持暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5      # 温度调节动态范围控制因子
  use_diam: True              # 【V12 新增】DIAM 可变形交互注意力 (一区TOP 2025, V1-153)

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 【V12 新增】傅里叶对比正则化损失 (ECCV 2024, V1-054)
  losses: ['mal', 'boxes', 'local', 'fcr']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      # 骨干基座保守锁定微调
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.000002
    -
      # 物理辅助流与 MSRB 主干直通桥专属学习率
      params: '^(?=.*(?:ir_stem|ir_proj|ir_align|occlusion_gate|coord_lift|bilateral_pool|shallow_edge_fuse|frontend_rfgm|s0_to_p3_trunk)).*$'
      lr: 0.00005
    -
      # Mamba 2D-SSM 专属微调学习率
      params: '^(?=.*ssm_blocks)(?!.*norm).*$'
      lr: 0.00003
      weight_decay: 0.0001
    -
      # MHLA 多头线性注意力专属唤醒学习率 (V12)
      params: '^(?=.*mhla_blocks)(?!.*norm).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # DIAM 可变形交互注意力专属唤醒学习率 (V12)
      params: '^(?=.*diam).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # P2 跨尺度小波与立柱几何引导专属学习率
      params: '^(?=.*p2_refinement).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # 3D 场景几何连续深度门控 (SGMG) 专属学习率
      params: '^(?=.*scene_gate).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # SNR-Aware FDR temp_head 专属学习率
      params: '^(?=.*temp_head).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # 归一化层 weight decay 归零
      params: '^(?=.*(?:encoder|decoder))(?!.*p2_refinement)(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 10
flat_epoch: 4
no_aug_epoch: 0

accum_steps: 1
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 24        # 【RTX PRO 6000 96GB 强劲动力 Batch 24】
  num_workers: 16
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.3, brightness: [0.9, 1.1], contrast: [0.85, 1.15], saturation: [0.85, 1.15], hue: [-0.02, 0.02]}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [999, 999]
    stop_epoch: 999
    copyblend_epochs: [999, 999]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  num_workers: 8
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 20
lr_warmup_scheduler:
  warmup_duration: 0
