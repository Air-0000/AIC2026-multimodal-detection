# =============================================================================
# Sovereign V31: Co-DETR Style One-to-Many Auxiliary Supervision Head
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100-SXM2 32GB, GPU 1)
# 机制:
#   1. 承接 Sovereign V30 (CSSP + ABC) 的终态巅峰权重作为底模
#   2. 激活 Co-ATSS One-to-Many 密集辅助监督头 (use_co_aux: True)
#   3. 训练期: 每个 GT 自适应分配 6~18 个正样本锚点，反向传播共享 Backbone 与 HybridEncoder
#   4. 推理期: 零额外开销 (0 ms 延迟，0 MB 显存)，单模型纯净端到端
#   5. 彻底拉升正样本 Query 置信度至 0.75 ~ 0.90，消灭低置信度保守性与漏检/幻觉两难
# =============================================================================

__include__: [
  './sovereign_v30_cssp_v29peak_2560.yml',
]

output_dir: ./outputs/sovereign_v31_co_one2many_2560

DEIM:
  use_co_aux: True                 # ★ 核心激活：One-to-Many 辅助密集监督
  co_aux_loss_weight_cls: 1.0      # 辅助分类 Focal Loss 权重
  co_aux_loss_weight_reg: 2.0      # 辅助回归 GIoU Loss 权重

DEIMCriterion:
  weight_dict:
    loss_co_cls: 1.0
    loss_co_reg: 2.0
    loss_cmal: 0.5
    loss_tadl: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25
    loss_ddf: 1.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone.rgb_net)(?!.*norm).*$'
      lr: 0.0000005                # 骨干平滑锁定 5e-7
    -
      params: '^(?=.*cssp_shallow).*$'
      lr: 0.00005                  # 浅层特征平稳维护 5e-5
    -
      params: '^(?=.*co_aux_head).*$'
      lr: 0.0001                   # ★ 核心：Co-Aux 辅助头以 1e-4 快速适应密集梯度
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000008                     # 主干平滑退火 8e-6
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 20
flat_epoch: 4
no_aug_epoch: 8                    # 全程关停增广，纯净特征吸附
