__include__: [
  './deimv2_dinov3_l_aic_rgd_linear.yml',
]

# Evaluation-only overlay: same weights, same depth encoding, only the RGB
# image folder changes (level=orig). Depth is illumination-invariant, so the
# depth folder stays identical -- that is the whole point.
output_dir: ./outputs/deimv2_dinov3_l_aic_rgd_linear__orig

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/depth_variants/linear/train
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 4
    modality: rgb_depth
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5], std: [0.229, 0.224, 0.225, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4
