# =========================================================================
# Stage A / RGB-only detector
# 由 scripts/gen/gen_staged_scratch_configs.py 从 vitl800_clean.yml 派生
# =========================================================================
__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# vitl800 CLEAN -- 干净单变量测试
# -----------------------------------------------------------------------------
# 基准 = midboost_combo (ViT-S / 640 / 标准增强 / RGB lr 1e-4, mAP 0.5222 @49ep)
# 本配置除 (a) backbone ViT-S->ViT-L (24层)  (b) 分辨率 640->800
#   (c) 按 24 层比例缩放 unfreeze 3->6 / interaction [5,8,11]->[11,17,23]
# 之外, 增强集 / lr / 调度 / mixup / batch 结构 全部与 midboost_combo 严格一致:
#   - 增强: 标准 (RandomPhotometricDistort5ch 0.6-1.4 + RandomNight5ch),
#           无 RandomAffine / 无 RandomRGBDegrade5ch (这些是污染版多加的)
# -----------------------------------------------------------------------------
# Stage A 与 vitl800_clean 的唯一刻意差异 (见 train_dataloader 里的注释):
#   RandomNight5ch  p 0.5->0.35,  bands 区间 [0.005,0.80] -> [0.55,1.00]
#   (绝对亮度由 0.002~0.358 抬到 0.246~0.447)。
#   理由: Stage A aux 恒零, 极暗样本无 IR 兜底 = 脏监督; 而测试集实测全白天
#         (mean 0.447 / p10 0.382 / <0.30 仅 0.3%), 原配方约 36% 样本低于 p10。
#   => Stage A 不再与 clean 严格单变量; B/C 保留原配方, 与 midboost 基线可比。
#   - RGB lr = 1e-4 (非 LLRD 封顶 2e-5), ir/depth = 1.5e-4 (同基线)
#   - 仅 batch 因 800 显存由 10/accum2(micro5) 改为 12/accum4(micro3)
# 这样 vitl800_clean vs vits800_clean 才是真正单变量 (backbone 大小 @800),
# vitl800_clean vs midboost_combo 才是 "ViT-L@800 是否超生产级 ViT-S@640"。
# =============================================================================
output_dir: ./outputs/vitl800_scratch_stageA_rgb

# 覆盖 base/deimv2.yml 的 eval_spatial_size (默认 640)
eval_spatial_size: [800, 800]

freeze_bn: false
accum_steps: 4          # micro=3, 有效 batch = 12
use_ema: True

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vitl16          # 更大 backbone (1024-dim, 24 层)
  aux_name: dinov3_vits16plus  # 辅助流保持 384-dim, 由 1x1 proj 升维
  weights_path: null           # aux/rgb 官方权重由 -t ckpts/dinov3/vitl16_rdttrack_scratch_full.pth 一次性加载
  interaction_indexes: [11, 17, 23]
  conv_inplane: 32
  hidden_dim: 256
  ir_drop_prob: 1.0
  depth_drop_prob: 1.0
  depth_in_chans: 1
  ir_in_chans: 2
  unfreeze_rgb_stages: 6
  # the new configurable LLRD knobs (see multimodal_backbones.py)
  llrd_top_lr: 1.0e-4
  llrd_decay: 0.85
  input_norm: instance

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37

DEIMTransformer:
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  num_layers: 6
  eval_idx: -1
  dim_feedforward: 2048

epoches: 40
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 400
flat_epoch: 20
no_aug_epoch: 3

## Optimizer -- 与 midboost_combo 严格一致 (RGB 1e-4, ir/depth 1.5e-4), 无 LLRD
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:ir_dinov3|depth_dinov3))(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0001
    -
      params: '^(?=.*.dinov3)(?!.*(?:ir_dinov3|depth_dinov3))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:ir_dinov3|depth_dinov3))(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00015
    -
      params: '^(?=.*(?:ir_dinov3|depth_dinov3))(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00015
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## Tri-modal dataset -- 与 midboost_combo 标准增强一致 (无加强)
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModalCached
    cache_img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deepir_cache/train
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # Stage A 专属: aux 恒零 -> 没有 IR 给暗样本兜底, 极暗档 = "纯噪声 + 有效标签" = 脏监督。
        # 测试集实测 mean 0.447 / p10 0.382 (无暗图), 故把夜化档位抬到测试集下沿:
        #   bands 下限 0.55 -> 绝对亮度 >= 0.447*0.55 = 0.246; p 0.5 -> 0.35。
        # 原配方 [[0.005,0.05,3],[0.05,0.25,2],[0.25,0.80,2]] 是 3/7 权重压在 0.005-0.05,
        # 换算绝对值 0.002-0.022, 测试集一张都没有。B/C 保留原配方 (IR 有信号, 非脏标签)。
        - {type: RandomNight5ch, p: 0.35, photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4], bands: [[0.55, 0.78, 2], [0.78, 1.00, 3]]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 12

  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
