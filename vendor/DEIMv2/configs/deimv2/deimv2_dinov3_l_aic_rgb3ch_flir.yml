__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# RGB-only (3ch) baseline evaluated on FLIR (OOD). Model trained on AIC with
# NO IR at all (outputs/deimv2_dinov3_l_aic/best_stg2.pth, DINOv3STAs).
# Comparison against the 4ch model shows whether IR helps OOD generalization.
# Run: python train.py -c <this> -r outputs/deimv2_dinov3_l_aic/best_stg2.pth --test-only
output_dir: ./outputs/deimv2_dinov3_l_aic_rgb3ch_flir

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  finetune: True
  conv_inplane: 32
  hidden_dim: 224

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## Keep train def identical to the RGB training config (unused in --test-only).
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

## FLIR as the (test-only) evaluation set: RGB only, 3 channels.
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/FLIR/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/FLIR/instances_flir_val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [512, 512]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

DEIMCriterion:
  matcher:
    matcher_change_epoch: 40
