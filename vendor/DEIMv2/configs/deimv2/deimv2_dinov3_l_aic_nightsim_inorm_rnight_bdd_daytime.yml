__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# BDD100K Nighttime detection -- ZERO-SHOT from AIC.
# =============================================================================
# BDD100K is RGB-only (no IR / no depth), so only the RGB-only 3ch model is
# meaningfully comparable. This is the standard "trained on day, tested at
# night" protocol, and it publishes PER-CLASS AP, which lets our zero-shot
# numbers be compared class-by-class against the published bounds:
#     Lower-Bound (day-trained, source only): Ped 50.0 Car 66.6 Bicycle 39.5
#                                             TrafficLight 41.0 TrafficSign 56.5
#     Upper-Bound (fully supervised on night): Ped 52.1 Car 73.6 Bicycle 41.8
#                                             TrafficLight 52.2 TrafficSign 63.3
# (mAP@0.5, 10-class protocol; we cover the 5 overlapping AIC classes.)
#
# Data: prepare_bdd100k.py -> data_aux/BDD100K/{rgb, instances_bdd_night.json}
# Run:  python train.py -c <this> -r outputs/deimv2_dinov3_l_aic/best_stg2.pth \
#                       --use-amp --test-only
output_dir: ./outputs/deimv2_dinov3_l_aic_nightsim_inorm_rnight_bdd_daytime

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  finetune: True
  conv_inplane: 32
  hidden_dim: 224
  input_norm: instance

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## Keep train def identical to the RGB training config (unused in --test-only).
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

## BDD100K night val (3929 imgs, 1280x720) -- RGB only, 3 channels.
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_daytime.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

DEIMCriterion:
  matcher:
    matcher_change_epoch: 40
