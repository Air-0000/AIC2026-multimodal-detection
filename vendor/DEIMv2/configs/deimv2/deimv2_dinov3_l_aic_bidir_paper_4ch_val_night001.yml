__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# Step 2 faithful re-impl of paper [4] Tang et al. (Bi-Directional Fusion +
# Deformation-Sensitive Loss). Backbone = DINOv3STAsBiDirPaper:
#   RGB branch FROZEN (pretrained DINOv3) + IR branch trainable (DINOv3 1ch,
#   init from RGB 3->1 mean), fused by BiDirProgFusion neck (paper [4], NO
#   cross-attention, NO depth -- paper [4] is RGB-T only and our depth stream
#   is dead weight at night per ablation).
# IR channel = deimv2_heat residual (same as ufall), 4ch = RGB(3)+IR(1).
output_dir: ./outputs/deimv2_dinov3_l_aic_bidir_paper_4ch/val_night001

print_freq: 50

DEIM:
  backbone: DINOv3STAsBiDirPaper

DINOv3STAsBiDirPaper:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  # embed_dim=384 / num_heads=6 / patch_size=16 use class defaults

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## DEIM LR-Scheduler
epoches: 50
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 1000
flat_epoch: 25
no_aug_epoch: 6

## Optimizer
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## Bi-modal dataset: RGB(3) + IR(1) = 4 channels (no depth).
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 4
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [512, 512]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5], std: [0.229, 0.224, 0.225, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 4

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 416
    mixup_epochs: [4, 25]
    stop_epoch: 45
    copyblend_epochs: [4, 45]
    base_size_repeat: 3

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night001
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    depth_folder: null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 4
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [512, 512]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5], std: [0.229, 0.224, 0.225, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 1

## DEIM Loss (paper [4]: DSSM replaces GIoU; L1 box loss kept)
DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 0, loss_fgl: 0.15, loss_ddf: 1.5, loss_dssm: 2.0}
  losses: ['mal', 'boxes', 'dssm']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 45
