# =============================================================================
# DEIM-D-FINE-X (HGNetv2-B5) AIC 12类单阶段微调(离线CP) -- 从官方 Objects365+COCO 成品热启动
# -----------------------------------------------------------------------------
# 与 ft_dcncp(在线CP) 唯一差异 = Copy-Paste 离线化:
#   - 贴图与标签训练前已生成好 (work_dir/deimv2_dataset/train_cpoff, 3600 张)
#   - build_cp_dataset.py 复用同一 RandomCopyPaste 算子(prob=1.0, 逐图固定种子)
#     => class 尺寸 / 只缩不放 / 零重叠 / sqrt 采样 / min_score 0.7 全部一致
#   - 本配置 transforms 里不再有 RandomCopyPaste; 其余增广/配方逐字不动
#   - 数据量 1800→~3550, 同 50ep 下总迭代约翻倍 (lr/EMA/增强节奏均按 epoch 等比)
# 起点: ckpts/dfine_x_obj2coco.pth (D-FINE-X, O365预训练→COCO微调完, COCO AP 59.3)
# 评测: 同目录 *_val_*.yml (day + 9 档 night), 由 gen_dfine_x_val_cfgs_cpoff.py 生成
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',   # HGNetv2-B5 + HybridEncoder + DFINETransformer
  '../dataset/aic_detection_cpoff.yml',       # AIC 12类 离线CP 数据集 (覆盖路径)
  '../base/deim.yml',                         # Dense O2O 增强 (Mosaic/Photometric/IoUCrop/mixup)
]

## === 离线 CP 数据集路径 (顶层 body, 压过 includes) ===
train_dataloader:
  dataset:
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train_cpoff/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train_cpoff/annotations/instances_train_cp.json

output_dir: ./outputs/deim_hgnetv2_x_aic_obj2coco_ft_cpoff

## 恢复官方微调的冻结设置 (deim.yml 会解冻 BN, 这里压回); 本地 ImageNet 主干缓存路径
HGNetv2:
  dcn_stages: [2, 3]   # DCNv2 zero-init residual (red=128, depthwise), ~0.85M
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/

## D-FINE ckpt (dfine_x_obj2coco.pth) 的 encoder 用经典双分支 CSPLayer = csp_type 'csp';
## fork 里 'csp' 分支原缺失(UnboundLocalError), 已在 hybrid_encoder.py 补上
HybridEncoder:
  csp_type: csp

## 与 checkpoint 训练时一致
DFINETransformer:
  activation: relu
  mlp_act: relu

## 微调节奏 (官方 obj2coco_24e: 24ep/gamma1/warmup0/flat到底; 数据量放大到 50ep)
epoches: 50
lrsheduler: flatcosine
lr_gamma: 1          # 官方微调 = 恒定 lr, 不走余弦
warmup_iter: 100    # 官方为 0, 但本框架 flatcosine 在 warmup_iter=0 时除零崩溃 (logs/dfine_x_ft_train.log 04:48 实锤); 100 iter ≈ 平滑起步
flat_epoch: 12000    # 恒定
no_aug_epoch: 4

## batch: 16 = micro4 x accum4
accum_steps: 4

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      type: Compose
      mosaic_prob: 0.5
      ops:
        - type: Mosaic
          output_size: 320
          rotation_range: 10
          translation_range: [0.1, 0.1]
          scaling_range: [0.5, 1.5]
          probability: 1.0
          fill_value: 0
          use_cache: True
          max_cached_images: 50
          random_pop: True
        - type: RandomPhotometricDistort
          p: 0.5
        - type: RandomZoomOut
          fill: 0
        - type: RandomIoUCrop
          p: 0.8
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: RandomHorizontalFlip
        - type: Resize
          size: [640, 640]
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: True
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: True
      policy:
        name: stop_epoch
        epoch: [2, 25, 46]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    mixup_epochs: [2, 25]
    stop_epoch: 46

val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      # aic_detection.yml 的 val transforms 是 ops: None (PIL 直进 collate 会崩,
      # 07:01 实锤 "'Image' object is not subscriptable"); 覆写为 base 同款
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

## 官方微调配方是 warmups:0 (常数 decay 0.9999) —— 那是 17.7万 iter 的尺度;
## 本任务 50ep 仅 ~1.1万 iter, 0.9999 恒定下 EMA 10ep 后仍是 ~89% 初始权重,
## val(评 EMA) 全程 AP=0 实锤。改用框架默认 warmups=1000 (decay 随 iter 从 0
## 指数爬升到 0.9999), 早期紧贴模型、后期平滑。
ema:
  warmups: 1000
lr_warmup_scheduler:
  warmup_duration: 0
