__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# PURE-INFRARED 2ch DIAGNOSTIC -- DEEPENED IR STEM (24-layer DINOv3-S)
# =============================================================================
# This is the "stem 改长" follow-up to deimv2_dinov3_l_aic_pureir2ch (0.245).
# Same 2ch IR input (heat residual + aligned raw IR, NO RGB), but the IR stem is
# LENGTHENED from 12 -> 24 transformer blocks (dinov3_vits16_deep). The extra 12
# blocks are initialised by repeating the first 12 (block-stacking) from the
# existing DINOv3-S stem weights, so no new pretrained checkpoint is needed.
#
# Why this and not a bigger DINOv3 (B/L): this codebase only ships DINOv3-S for
# the multimodal branches (even "deimv2_dinov3_l_aic*" use a DINOv3-S IR/RGB
# branch -- the "L" is the DEIM detection head, not the DINOv3 variant).
#
# interaction_indexes [11,17,23] sample the 3 finest of the 24 blocks to feed
# c2/c3/c4, matching the [5,8,11] spacing of the 12-block stem.
#
# NOTE: batch is 4 (not 8 like the 12-block run) because the 24-layer backbone
# roughly doubles activation memory; this is a known protocol difference vs the
# 0.245 baseline and is flagged for fair reading of the result.
output_dir: ./outputs/deimv2_dinov3_l_aic_pureir3ch_deep

DEIM:
  backbone: DINOv3STAsPureIR

DINOv3STAsPureIR:
  name: dinov3_vits16_deep
  weights_path: ./ckpts/deimv2_l_coco/dinov3_vits16_stem.pth
  interaction_indexes: [11, 17, 23]
  conv_inplane: 32
  hidden_dim: 224
  ir_in_chans: 3

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## DEIM LR-Scheduler
epoches: 68
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34
no_aug_epoch: 8

## Optimizer
optimizer:
  type: AdamW
  params:
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
      weight_decay: 0.
    -
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## IR-only dataset: modality=ir -> x = [heat(1), raw_ir(1), deleak(1)]  (3 channels)
## 相对 pureir2ch_deep (best mAP 0.2983) 的唯一改动: 第三路 de-leaked IR + ir_in_chans 2->3
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/images
    deleak_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared_deleak
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    modality: ir
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 4
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/valid
    deleak_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared_deleak
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    modality: ir
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 8

## DEIM Loss
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
