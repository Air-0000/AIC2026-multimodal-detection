__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# LEVER 4 cssa night005 SMOKE: 同协议 night005 复评 (val batch=1)。
# RGB 暗化到 ~0.005（近黑），IR/Depth 保持正常，看 GENUINE CSSA 门控能否把
# 全黑档 mAP 从裸深度5ch 的 0.116 / 自编 env 门控 0.207 提上去。
# 底座=5ch 裸深度 (RGB3+IR1+rawDepth1)，唯一增量 rgb_gate='cssa'（对照 envgate）。
output_dir: ./outputs/deimv2_dinov3_l_aic_rdttrack_heat_night_log_rnight_ufall_cssa__night01_smoke

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  depth_in_chans: 1
  unfreeze_rgb_stages: 12
  input_norm: instance
  rgb_gate: 'cssa'            # GENUINE CSD CSSA module (ECA channel switching + spatial attention)

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

epoches: 68
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34
no_aug_epoch: 8

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00005
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 5
    depth_mode: raw
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 8
  drop_last: True
  total_batch_size: 8

  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 3

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night01
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 5
    depth_mode: raw
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 2
  drop_last: False
  total_batch_size: 1

DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
