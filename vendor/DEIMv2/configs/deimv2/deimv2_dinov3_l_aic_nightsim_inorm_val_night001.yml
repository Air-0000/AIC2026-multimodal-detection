__include__: [
  "../dataset/aic_detection.yml",
  "../runtime.yml",
  "../base/dataloader.yml",
  "../base/optimizer.yml",
  "../base/deimv2.yml",
]

output_dir: ./outputs/outputs/deimv2_dinov3_l_aic_nightsim_inorm__night001

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: [5, 8, 11]
  finetune: True
  conv_inplane: 32
  hidden_dim: 224
  input_norm: instance

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night001
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: "float32", scale: True}
  shuffle: False
  num_workers: 2
  drop_last: False
  total_batch_size: 1

DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
