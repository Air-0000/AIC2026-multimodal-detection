__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# NIGHT-ROBUST TRAINING (day -> night)
# =============================================================================
# AIC is a *daytime-only* training set, but the deployment/test condition is
# **night**. The night-robustness curve (prep_night_robust.py / run_night_robust.sh)
# shows the ranking inverts at night: at deep night (RGB x0.05) RGB-only 3ch
# collapses to AP 0.068 while the 5ch multimodal models hold (prompt 0.295,
# diffuse 0.224). So the multimodal design is the right direction -- but it was
# never *trained* for night.
#
# RandomRGBDegrade5ch simulates the night condition on the visible channels only
# with p=0.5, leaving IR/Depth (illumination-invariant thermal / geometric cues)
# untouched. This forces the detector to fall back on the aux modalities whenever
# the visible camera fails, i.e. it *trains* night robustness from day data.
#
# brightness is drawn LOG-uniformly on [0.05, 0.80]: the four evaluation levels
# (dark05/12/25/50) are roughly x2-spaced, so log-uniform gives each octave ~25%
# mass, and b=0.05 reproduces the dark05 level exactly. NOTE the operator order
# in the transform is contrast-then-attenuate -- attenuating first and then
# stretching contrast about mid-grey pulls the darkened image back up and
# cancels the night simulation.
#
# Base design = RDTTrack "prompt" (best night-robust multimodal: dark05 0.295),
# + stage-2 backbone unfreeze (unfreeze_rgb_stages: 2), which lifted the 5ch
# in-domain AP from 0.432 to 0.481 on the diffuse variant.
# Resume from the prompt checkpoint (already trained), then adapt to night.
output_dir: ./outputs/deimv2_dinov3_l_aic_rdttrack_heat_night_log_rnight_ufall__night12

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  unfreeze_rgb_stages: 2
  input_norm: instance

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## DEIM LR-Scheduler -- matches the successful unfreeze run
epoches: 68
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34
no_aug_epoch: 8

## Optimizer -- backbone LR 5e-5 (the unfrozen blocks must actually move)
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00005
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## Tri-modal dataset: RGB(3) + IR(heat residual)(1) + Depth(1) = 5 channels.
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.05, 0.80], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 8
  drop_last: True
  total_batch_size: 8

  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 3

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night12
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

## DEIM Loss
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
