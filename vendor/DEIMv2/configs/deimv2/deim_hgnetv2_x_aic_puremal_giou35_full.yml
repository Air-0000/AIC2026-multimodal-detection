# =============================================================================
# DEIM-D-FINE-X (HGNetv2-B5) AIC -- 纯 MAL2 + GIoU 3.5 全周期 50-Epoch 从头训练
# -----------------------------------------------------------------------------
# 从 dfine_x_obj2coco.pth 热启动 (非从 puremal checkpoint 继续)
# 优化项:
#   1. loss_mal: 2.0  (双倍负样本惩罚, puremal 最优验证)
#   2. loss_giou: 3.5 (强化 AP75 边界精度)
#   3. cost_giou: 3.5 (匈牙利匹配偏好高 IoU Query)
#   4. loss_fgl: 0.20 (细粒度分布回归强化)
#   5. micro-batch=8, accum=2 → total_batch=16 (14.8GB VRAM, 2x 速度)
# =============================================================================
__include__: [
  'deim_hgnetv2_x_aic_obj2coco_ft.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_puremal_giou35_full

# Faster training: micro-batch 8
accum_steps: 4

train_dataloader:
  total_batch_size: 16

DEIMCriterion:
  weight_dict:
    loss_mal: 2
    loss_bbox: 5
    loss_giou: 3.5
    loss_fgl: 0.20
    loss_ddf: 1.5
  matcher:
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 3.5
