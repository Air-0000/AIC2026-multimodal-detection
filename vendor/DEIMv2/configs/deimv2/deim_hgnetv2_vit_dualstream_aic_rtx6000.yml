# =============================================================================
# DEIM-D-FINE-X 异构双流 (HGNetv2-B5 CNN + DAv2 ViT) -- AIC 12类多模态目标检测
# NVIDIA RTX PRO 6000 Blackwell Server Edition (96GB VRAM) 极致并发配置
# -----------------------------------------------------------------------------
# 架构规范 (docs/cnn_vit_dual_stream_multimodal_design.md):
#   - 流一 (CNN): HGNetv2-B5 (RGB 3ch + IR 2ch), 捕捉高频亚像素边缘与热源
#   - 流二 (ViT): DAv2 ViT-Small (3D 几何先验与大模型空间长程语义, 84.8% 探测率)
#   - 跨范式双向交互桥:
#       * CNN -> ViT: Sobel 高频梯度提示注入 (HighFreqEdgePrompt)
#       * ViT -> CNN: 空间降采样多头交叉注意力引导 (ViTToCNNCrossGuidance, 零初始化门控)
#   - 共享-特异正交子空间解耦:
#       * 共享语义 Z_s: 照度感知有界凸组合 (BoundedDualConvexGating)
#       * 特异物理 Z_p: 极小有界 Tanh 残差注入 (0.05 scale)
#       * 正交损失: L_orth
#   - 96GB 显存特权:
#       * accum_steps: 1 (零微批次累积延迟, 梯度完全实时反向传播)
#       * total_batch_size: 16 (真正的全量物理单批次)
#       * num_workers: 8 (充分利用 208 核 Xeon Platinum 算力)
#       * epoches: 72 (预计 ~45 分钟完成全部收敛)
#
# 起点权重: /root/autodl-tmp/AIC/vendor/DEIMv2/ckpts/dfine_x_obj2coco.pth
# DAv2 权重: /root/autodl-tmp/AIC/work_dir/da2_weights/depth_anything_v2_vits.pth
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_vit_dualstream_aic_rtx6000

DEIM:
  backbone: HGNetv2ViTDualStream

HGNetv2ViTDualStream:
  name: B5
  return_idx: [1, 2, 3]
  ir_in_chans: 2
  stem_base: 64
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  vit_encoder: 'vits'
  vit_ckpt_path: '/root/autodl-tmp/AIC/work_dir/da2_weights/depth_anything_v2_vits.pth'
  vit_embed_dim: 384
  vit_input_size: 518
  sub_dim: 96
  unfreeze_vit_blocks: 0        # Stage 1: 0 (稳健对齐); 10 ep后可调至 4
  llrd_top_lr: 0.00002
  llrd_decay: 0.85
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

## 优化器参数组 (互斥正则匹配)
optimizer:
  params:
    -
      params: '^(?=.*backbone\.(?:c2v_|v2c_|disentangle_|fusion_|ir_|vit_projs))'
      lr: 0.00025
    -
      params: '^(?=.*backbone\.rgb_net)(?!.*norm|bn).*$'
      lr: 0.0000025
    -
      params: '^(?=.*backbone\.vit\.)'
      lr: 0.00002
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 72
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 100
flat_epoch: 12000
no_aug_epoch: 4

## 96GB 显存配置: 单卡真正全批次 batch 16, accum_steps: 1
accum_steps: 1

train_dataloader:
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /root/autodl-tmp/AIC/dataset/train/infrared
    raw_ir_folder: /root/autodl-tmp/AIC/dataset/train/infrared
    depth_folder: /root/autodl-tmp/AIC/dataset/train/depth
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.005, 0.45], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  num_workers: 4
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [3, 36]
    stop_epoch: 68
    copyblend_epochs: [3, 68]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /root/autodl-tmp/AIC/dataset/train/infrared
    raw_ir_folder: /root/autodl-tmp/AIC/dataset/train/infrared
    depth_folder: /root/autodl-tmp/AIC/dataset/train/depth
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False

ema:
  warmups: 500
lr_warmup_scheduler:
  warmup_duration: 0
