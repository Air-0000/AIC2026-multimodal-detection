# =============================================================================
# Sovereign V29 High-Res 2048: 多模态全要素 + DINOv3-ViT-L 大模型高分辨率蒸馏
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100 32GB, GPU 1)
# 机制:
#   1. 分辨率跃升至 1152 x 2048 满血超大尺度 (相比 1792 像素再扩 +28.6%)。
#   2. total_batch_size: 2 + accum_steps: 2 (等效物理 Batch 4，显存安全稳定 ~22.8GB)。
#   3. 在 0.556 历史最强底座上进行 2048 空间细粒度蒸馏提纯。
# =============================================================================

__include__: [
  './sovereign_v29_cycle2_stage1_distill.yml',
]

task: detection
eval_spatial_size: [1152, 2048]

accum_steps: 2
print_freq: 20

train_dataloader:
  total_batch_size: 2
  num_workers: 4
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1152, 2048]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 4
        ops: ['RandomPhotometricDistort5ch', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2048
    base_size_repeat: ~
    stop_epoch: 4

val_dataloader:
  total_batch_size: 2
  num_workers: 4
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1152, 2048]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
