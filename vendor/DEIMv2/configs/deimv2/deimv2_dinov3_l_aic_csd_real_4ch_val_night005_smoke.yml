__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# GENUINE CSD (Cao et al. CVPR 2023) paper method -- bi-modal RGB(3)+IR(1)=4ch,
# night005 SMOKE (val batch=1)。评测前把 RGB 暗化到 ~0.005（近黑），IR 保持正常
# （raw IR，与训练一致），看真实 CSD 方法（无深度分支）在近黑档的表现。
# val resize 用 640 与 5ch 系列对齐协议；模型本身按 512 训练，RT-DETR 推理分辨率无关。
output_dir: ./outputs/deimv2_dinov3_l_aic_csd_real_4ch__night005_smoke

DEIM:
  backbone: DINOv3STAsCSD

DINOv3STAsCSD:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

epoches: 50
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 1000
flat_epoch: 25
no_aug_epoch: 6

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/images
    depth_folder: null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 4
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [512, 512]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5], std: [0.229, 0.224, 0.225, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 4

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 416
    mixup_epochs: [4, 25]
    stop_epoch: 45
    copyblend_epochs: [4, 45]
    base_size_repeat: 3

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/aic_valid_rgb_night005
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/valid
    depth_folder: null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 4
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5], std: [0.229, 0.224, 0.225, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 2
  drop_last: False
  total_batch_size: 1

DEIMCriterion:
  matcher:
    matcher_change_epoch: 40
