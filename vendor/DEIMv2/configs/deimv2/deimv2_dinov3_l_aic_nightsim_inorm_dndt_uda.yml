__include__:
  - '../dataset/aic_detection.yml'
  - '../runtime.yml'
  - '../base/dataloader.yml'
  - '../base/optimizer.yml'
  - '../base/deimv2.yml'

__include__:
- ../dataset/aic_detection.yml
- ../runtime.yml
- ../base/dataloader.yml
- ../base/optimizer.yml
- ../base/deimv2.yml
output_dir: ./outputs/deimv2_dinov3_l_aic_nightsim_inorm_dndt_uda
DEIM:
  backbone: DINOv3STAs
DINOv3STAs:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes:
  - 5
  - 8
  - 11
  finetune: true
  conv_inplane: 32
  hidden_dim: 224
  input_norm: instance
HybridEncoder:
  in_channels:
  - 224
  - 224
  - 224
  hidden_dim: 224
  dim_feedforward: 896
DEIMTransformer:
  feat_channels:
  - 224
  - 224
  - 224
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792
epoches: 30
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 15
no_aug_epoch: 8
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$
    lr: 1.25e-05
  - params: ^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$
    lr: 1.25e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.000125
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_daytime.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: true
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: RandomDNDTNightify
        p: 0.5
        bright_range:
        - 0.005
        - 0.5
        curriculum: true
        total_epochs: 30
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        epoch:
        - 4
        - 15
        - 28
  shuffle: true
  num_workers: 2
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs:
    - 4
    - 15
    stop_epoch: 28
    copyblend_epochs:
    - 4
    - 28
    base_size_repeat: 3
  total_batch_size: 8
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_night.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
  shuffle: false
  num_workers: 0
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 16
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
task: dndt
target_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/rgb
    ann_file: /home/constant/CodeBuddy/Dev/AIC/data_aux/BDD100K/instances_bdd_night.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
  shuffle: true
  num_workers: 0
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
dndt:
  w_src: 1.0
  w_cdrc: 1.0
  w_tgt: 2.0
  cls_thr: 0.5
  iou_thr: 0.5
  max_obj: 4
  icfb: true
  p_mix: 1.0
