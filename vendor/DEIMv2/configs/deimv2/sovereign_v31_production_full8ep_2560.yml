# =============================================================================
# Sovereign V31: Full Production 8-Epoch Training with Co-ATSS One-to-Many Aux Head
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100 32GB, GPU 1)
# 机制:
#   1. 承接 Sovereign V29 Cycle 5 Peak 历史最高巅峰 (mAP 0.5808 / UAV 100%) 作为底模
#   2. 激活 Co-ATSS One-to-Many 辅助密集监督头 (use_co_aux: True)
#   3. 2.5K 超清原生尺度 (1440 x 2560) + 浅层 CSSP + ABC 多模态显著性模块
#   4. 训练期: 每个 GT 自适应分配 6~18 个正样本锚点，反向传播共享 Backbone 与 HybridEncoder
#   5. 推理期: 零额外开销 (0 ms 延迟，0 MB 显存)，单模型纯净端到端
#   6. 8 轮平滑余弦退火 (flat_epoch: 2, lr_gamma: 0.15, no_aug_epoch: 0)，压实极值收敛点
# =============================================================================

__include__: [
  './sovereign_v30_cssp_v29peak_2560.yml',
]

output_dir: ./outputs/sovereign_v31_production_full8ep_2560

DEIM:
  use_co_aux: True                 # ★ 核心激活：One-to-Many 辅助密集监督
  co_aux_loss_weight_cls: 1.0      # 辅助分类 Focal Loss 权重
  co_aux_loss_weight_reg: 2.0      # 辅助回归 GIoU Loss 权重

DEIMCriterion:
  weight_dict:
    loss_co_cls: 1.0
    loss_co_reg: 2.0
    loss_cmal: 0.5
    loss_tadl: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25
    loss_ddf: 1.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone.rgb_net)(?!.*norm).*$'
      lr: 0.0000005                # 骨干平滑锁定 5e-7
    -
      params: '^(?=.*cssp_shallow).*$'
      lr: 0.00005                  # 浅层特征平稳维护 5e-5
    -
      params: '^(?=.*co_aux_head).*$'
      lr: 0.0001                   # Co-Aux 辅助头以 1e-4 适应密集梯度
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000008                     # 主干平滑退火 8e-6
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8
lrsheduler: flatcosine
lr_gamma: 0.15                     # 退火衰减系数：从 8e-6 平滑退火至 1.2e-6
warmup_iter: 20
flat_epoch: 2                      # 前 2 轮保持初始平稳学习率
no_aug_epoch: 0                    # 允许余弦平滑退火延伸至最后一轮

accum_steps: 2
print_freq: 20
checkpoint_freq: 1
