# =============================================================================
# DEIM-D-FINE-X 顶会模块终极合流 V13 (Sovereign Multimodal V13 - Sovereign Ascendant)
# -----------------------------------------------------------------------------
# 架构底座: 继承 Sovereign V12 最佳检查点 (58.29% mAP 历史第一峰值)
# 起步热启: outputs/deim_hgnetv2_x_aic_sovereign_v12_rtx6000/best_stg1.pth
# 核心顶会王牌模块三阶全向合流 (数学恒等热启 + 物理探针验证 + 全链路闭环):
#   1. [V1-231 LFP 低频引导净化模块 (CVPR 2026) in P2-CSRG+]:
#      - 以 P3 (80x80) 低频大尺度稳健语义表征作为引导滤波器锚点
#      - 坚决滤除平坦水面与天空的高频波纹无规律扰动，坚决保留 3px 极细立柱几何边界
#      - 严格零初始化 (Zero-Init): 初始时刻 100.00% 绝对数值等价于 V12
#   2. [V1创新038 PBD 峰值-背景能量正交解耦 (Peak-Background Decoupling) in P3]:
#      - 将特征流正交解耦为离散显著峰值能量 (Foreground Peak) 与广延漫反射背景 (Diffuse Background)
#      - 检测头对峰值流聚焦，漫反射背景流被特征吸收，物理切断陆地长椅/水面反光假阳性根源
#      - 严格零初始化 (Zero-Init): 初始残差为 0，平滑无损热启
#   3. [V1-185 MixStyle 跨域泛化模块 (ICLR / 1区TOP) in HGNetv2MultiModal]:
#      - 训练期在 Batch 实例间对特征统计量 (均值与方差) 进行动态 Beta 插值
#      - 0 额外参数，彻底根除昼夜/天气光照分布漂移 (Domain Shift)，eval 期间 100% 旁路恒等
#   4. [继承 V12 完整王牌矩阵]:
#      - V1-218 MHLA 多头线性注意力 + Mamba 2D-SSM 双核特征颈
#      - V1-153 DIAM 可变形交互注意力 (DETR Decoder)
#      - V1-054 傅里叶对比正则化损失 (ECCV 2024, FCR Loss)
#      - 内生化 CAA-SAHI 3-View 高清切片推理直通
#      - DCDA 深度形变对齐 + 3D-Lift + DOG 阶跃遮挡隔离门控
#   5. [算力加速与显存极致释放]:
#      - 批大小 total_batch_size: 24 (RTX PRO 6000 Blackwell 96GB VRAM)
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_sovereign_v13_rtx6000

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: True       # 内生化 3 视角高清切片，推理直通
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_dynamic_gating: False   # 锁定关闭动态门控，防止退化
  use_shallow_edge_fuse: True # 浅层高频边缘注入 (集成保峰双路池化与天水噪声截断)
  use_rfgm_edge: True         # AAAI 2026 RFGM 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # AAAI 2026 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 (160x160) -> Stage 1 (80x80 P3) 主干微残差直通桥
  use_mixstyle: True          # 【V13 新增】V1-185 MixStyle 跨域泛化 (ICLR)
  mixstyle_p: 0.3             # 风格混合概率
  pretrained_ir_stem: True    # ImageNet 预训练边缘核赋权 IR Stem
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 160x160) 供 HybridEncoder 高频引导
  stem_base: 64
  ir_drop_prob: 0.05
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 (P3: 80x80) 与 Level 1 (P4: 40x40) 2D-SSM 线性全局交互
  ssm_d_state: 16             # 状态空间隐藏维度
  use_mhla_levels: [0, 1]     # MHLA 多头线性注意力 (ICLR 2026, V1-218)
  mhla_num_heads: 4
  use_p2_guidance: True       # P2 (160x160) 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控 + 天水噪声截断
  p2_dim: 128                 # Stage 0 通道数
  use_lfp: True               # 【V13 新增】V1-231 LFP 低频引导净化模块 (CVPR 2026)
  use_pbd: True               # 【V13 新增】V1创新038 PBD 峰值-背景解耦 (Peak-Background Decoupling)

DFINETransformer:
  use_snr_sharpen: True       # 保持暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5      # 温度调节动态范围控制因子
  use_diam: True              # DIAM 可变形交互注意力 (一区TOP 2025, V1-153)

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 傅里叶对比正则化损失 (ECCV 2024, V1-054)
  losses: ['mal', 'boxes', 'local', 'fcr']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      # 骨干基座保守锁定微调
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.000002
    -
      # 物理辅助流与 MSRB 主干直通桥专属学习率
      params: '^(?=.*(?:ir_stem|ir_proj|ir_align|occlusion_gate|coord_lift|bilateral_pool|shallow_edge_fuse|frontend_rfgm|s0_to_p3_trunk)).*$'
      lr: 0.00005
    -
      # Mamba 2D-SSM 专属微调学习率
      params: '^(?=.*ssm_blocks)(?!.*norm).*$'
      lr: 0.00003
      weight_decay: 0.0001
    -
      # MHLA 多头线性注意力专属唤醒学习率
      params: '^(?=.*mhla_blocks)(?!.*norm).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # DIAM 可变形交互注意力专属唤醒学习率
      params: '^(?=.*diam).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # P2 跨尺度小波/垂直条带/LFP 低频净化专属学习率
      params: '^(?=.*p2_refinement).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # PBD 峰值-背景解耦专属唤醒学习率 (V13)
      params: '^(?=.*pbd).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # 3D 场景几何连续深度门控 (SGMG) 专属学习率
      params: '^(?=.*scene_gate).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # SNR-Aware FDR temp_head 专属学习率
      params: '^(?=.*temp_head).*$'
      lr: 0.0001
      weight_decay: 0.0001
    -
      # 归一化层 weight decay 归零
      params: '^(?=.*(?:encoder|decoder))(?!.*p2_refinement)(?!.*pbd)(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 10
flat_epoch: 4
no_aug_epoch: 0

accum_steps: 1
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 24        # 【RTX PRO 6000 96GB 强劲动力 Batch 24】
  num_workers: 16
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.3, brightness: [0.9, 1.1], contrast: [0.85, 1.15], saturation: [0.85, 1.15], hue: [-0.02, 0.02]}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [999, 999]
    stop_epoch: 999
    copyblend_epochs: [999, 999]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  num_workers: 8
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 20
lr_warmup_scheduler:
  warmup_duration: 0
