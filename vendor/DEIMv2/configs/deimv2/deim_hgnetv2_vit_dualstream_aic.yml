# =============================================================================
# DEIM-D-FINE-X 异构双流 (HGNetv2-B5 CNN + DAv2 ViT) -- AIC 12类多模态目标检测
# -----------------------------------------------------------------------------
# 架构规范 (docs/cnn_vit_dual_stream_multimodal_design.md):
#   - 流一 (CNN): HGNetv2-B5 (RGB 3ch + IR 2ch), 捕捉高频亚像素边缘与热源
#   - 流二 (ViT): DAv2 ViT-Small (3D 几何先验与大模型空间长程语义, 84.8% 探测率)
#   - 跨范式双向交互桥:
#       * CNN -> ViT: Sobel 高频梯度提示注入 (HighFreqEdgePrompt)
#       * ViT -> CNN: 空间降采样多头交叉注意力引导 (ViTToCNNCrossGuidance, 零初始化门控)
#   - 共享-特异正交子空间解耦:
#       * 共享语义 Z_s: 照度感知有界凸组合 (BoundedDualConvexGating)
#       * 特异物理 Z_p: 极小有界 Tanh 残差注入 (0.05 scale)
#       * 正交损失: L_orth
#   - ViT 渐进微调:
#       * Stage 1 (0-10 ep): ViT 全面冻结 (unfreeze_vit_blocks: 0), 稳固桥接对齐
#       * Stage 2 (11-50 ep): 解冻尾部 4 个 Blocks (8..11), LLRD 衰减 0.85, top_lr 2e-5
#
# 起点权重: ckpts/dfine_x_obj2coco.pth (官方 COCO 59.3 / 内部 0.5550 AP 最强基座热启动)
# DAv2 权重: work_dir/da2_weights/depth_anything_v2_vits.pth
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_vit_dualstream_aic

DEIM:
  backbone: HGNetv2ViTDualStream

HGNetv2ViTDualStream:
  name: B5
  return_idx: [1, 2, 3]
  ir_in_chans: 2
  stem_base: 64
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  vit_encoder: 'vits'
  vit_ckpt_path: '/home/constant/CodeBuddy/Dev/AIC/work_dir/da2_weights/depth_anything_v2_vits.pth'
  vit_embed_dim: 384
  vit_input_size: 518
  sub_dim: 96
  unfreeze_vit_blocks: 0        # Stage 1: 0 (冻结); Stage 2 可调至 4
  llrd_top_lr: 0.00002
  llrd_decay: 0.85
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

## 优化器参数组 (互斥正则匹配)
## 1. 跨范式交互桥、门控与IR/ViT投影: 从零训练 -> 头部 lr 2.5e-4
## 2. HGNetv2-B5 光热主干: 官方微调 lr 2.5e-6
## 3. ViT 主干: Stage 1 冻结不参与; Stage 2 解冻块自带 llrd_lr, 由框架自动拆分子组
optimizer:
  params:
    -
      params: '^(?=.*backbone\.(?:c2v_|v2c_|disentangle_|fusion_|ir_|vit_projs))'
      lr: 0.00025
    -
      params: '^(?=.*backbone\.rgb_net)(?!.*norm|bn).*$'
      lr: 0.0000025
    -
      params: '^(?=.*backbone\.vit\.)'
      lr: 0.00002
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 50
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 100
flat_epoch: 12000
no_aug_epoch: 4

## RTX 5060 Ti 15.46GB 显存配置: batch 16 = micro2 x accum8
accum_steps: 8

train_dataloader:
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.005, 0.45], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [3, 25]
    stop_epoch: 46
    copyblend_epochs: [3, 46]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False

ema:
  warmups: 1000
lr_warmup_scheduler:
  warmup_duration: 0
