# =============================================================================
# Sovereign V29 High-Res 2048: 纯净无偏退火与 2048 高精度决策边界收官
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100 32GB, GPU 1)
# 机制:
#   1. 分辨率跃升至 1152 x 2048 满血超大尺度。
#   2. total_batch_size: 2 + accum_steps: 2 (等效物理 Batch 4)。
#   3. 超低学习率全局平滑退火 (8e-6 -> 1e-6)，在 2048 密集像素网格上精准压实边界。
# =============================================================================

__include__: [
  './sovereign_v29_stage2c_pure_annealing.yml',
]

task: detection
eval_spatial_size: [1152, 2048]

accum_steps: 2
print_freq: 20

train_dataloader:
  total_batch_size: 2
  num_workers: 4
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1152, 2048]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2048
    base_size_repeat: ~
    stop_epoch: 0

val_dataloader:
  total_batch_size: 2
  num_workers: 4
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1152, 2048]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
