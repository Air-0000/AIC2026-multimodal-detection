# =============================================================================
# Sovereign V29 Stage 2-C: 纯净无偏退火与高精度边界框收官 (最终交付模型诞生)
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100-SXM2 32GB, 0 元/小时)
# 训练哲学:
#   1. 关停所有几何破坏性增广:
#      停用 Mosaic、RandomIoUCrop 与失真增强，100% 喂入真实未畸变多模态对齐图像。
#   2. 超低学习率全局平滑退火 (8e-6):
#      消除训练震荡，锁定全局极值收敛点。
#   3. 细粒度边界框分布与任务对齐完美定型:
#      TADL + DDF/FGL 推动边界框极度紧凑贴合，全面拉爆 AP75 与最终官方测试集表现。
# =============================================================================

__include__: [
  './sovereign_v29_stage2b_deep_fusion.yml',
]

output_dir: ./outputs/sovereign_v29_stage2c_pure_annealing

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone.rgb_net)(?!.*norm).*$'
      lr: 0.000001              # 骨干稳定锁定 1e-6
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000008                  # 全局超低平滑退火 8e-6
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 6                      # 阶段 2-C：6 轮纯净无偏平滑退火
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 10
flat_epoch: 2
no_aug_epoch: 6                 # 全程关停增广

accum_steps: 1
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 3
  num_workers: 6
  persistent_workers: True
  pin_memory: True
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1792]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1792
    base_size_repeat: ~
    stop_epoch: 0
