# =============================================================================
# Sovereign V22 极值高分辨率 (1216x672) Cycle 2 (第二周期 72-Epoch) 进阶精炼配置
# 算力平台: NVIDIA RTX PRO 6000 Blackwell (96GB VRAM, 600W 满血)
# 用户身份: 刘正阳 (liuzhengyang)
# -----------------------------------------------------------------------------
# 进阶战术规划:
#   - 热启底座: Cycle 1 巅峰结晶 (outputs/..._full72e/best_stg1.pth)
#   - 极值分辨率: 1216 x 672 (16:9 原生画幅 + 32 步长对齐)
#   - 极值 Batch: 24 (压榨 94.86 GB 显存)
#   - 周期重启学习率折半: Base LR 5e-5, Backbone LR 1e-6 (微调收敛探索)
#   - 进阶无增强退火: no_aug_epoch 8 (最后 8 轮纯净无扰动梯度平滑收敛)
#   - 终极融合目标: 与 Cycle 1 最优模型进行 0.5:0.5 参数流形 Model Soup
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: detection
eval_spatial_size: [672, 1216]
output_dir: ./outputs/sovereign_v22_highres1216_rtx6000_cycle2_72e

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: True       # 内生化 3 视角高清切片推理直通
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_shallow_edge_fuse: True # 浅层高频边缘注入
  use_rfgm_edge: True         # AAAI 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 -> Stage 1 微残差直通桥
  use_mixstyle: True          # MixStyle 跨域泛化
  mixstyle_p: 0.3
  pretrained_ir_stem: True
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 160x160)
  stem_base: 64
  ir_drop_prob: 0.05
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: False

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 (P3: 84x152) 与 Level 1 (P4: 42x76) 2D-SSM
  ssm_d_state: 16
  use_p2_guidance: True       # P2 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控
  p2_dim: 128
  use_lfp: True               # LFP 低频引导净化
  use_pbd: True               # PBD 峰值-背景解耦 (Spatial-PBD)
  use_starconv: True          # StarConv 微软星形运算 (CVPR 2024)

DFINETransformer:
  use_snr_sharpen: True       # 暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5
  use_diam: True              # DIAM 可变形交互注意力

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 傅里叶对比正则化损失
  losses: ['mal', 'boxes', 'local', 'fcr']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.000001           # 骨干网络折半为 1e-6
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00005                 # 头部与交互层折半为 5e-5
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 72
lrsheduler: flatcosine
lr_gamma: 0.02                # 深度余弦退火: Head 5e-5 -> 1e-6, Backbone 1e-6 -> 2e-8
warmup_iter: 20
flat_epoch: 8                 # 缩短至 8 轮快速退火介入，逼迫梯度向谷底精细下潜
no_aug_epoch: 8               # 进阶退火延长至 8 轮 (最后 8 轮极值收敛)

accum_steps: 1
print_freq: 20
checkpoint_freq: 12

train_dataloader:
  total_batch_size: 20
  num_workers: 8
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train_clean_quality.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Mosaic, output_size: [336, 608], rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.7, 1.3],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [672, 1216]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [2, 56, 64]
        ops: ['Mosaic', 'RandomPhotometricDistort5ch', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: 0.5

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1216
    base_size_repeat: ~
    stop_epoch: 64
    ema_restart_decay: 0.9998
    mixup_epochs: [2, 56]
    mixup_prob: 0.5
    copyblend_epochs: [2, 56]
    copyblend_prob: 0.5
    copyblend_type: blend
    area_threshold: 100
    num_objects: 3

val_dataloader:
  type: DataLoader
  total_batch_size: 20
  num_workers: 4
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val_clean_quality.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [672, 1216]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 20
  decay: 0.9999


