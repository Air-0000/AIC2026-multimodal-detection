# =============================================================================
# Sovereign V29 Stage 1: 纯 RGB 大模型语义蒸馏与分类头点火 (从开源底模起步)
# 硬件平台: 实验室科研服务器 ailab40 (2 × Tesla V100-SXM2 32GB, 0 元/小时)
# 训练哲学:
#   1. 纯净同模态蒸馏:
#      学生与教师均使用 100% 纯 RGB 3 通道输入，领域完全对齐，严禁多模态负迁移。
#   2. 类别觉醒与头点火:
#      从开源 dfine_x_obj2coco.pth 迁移，分类头 (score_head) 设高学习率 2.5e-4，
#      在 12 轮内快速完成 Hungarian Matcher 二分图匹配收敛，彻底杜绝冷启动卡死。
#   3. DINOv3 语义注入:
#      Meta DINOv3-ViT-Large (300M) 冻结推理，在线 Cosine + Gram 拓扑特征蒸馏。
# =============================================================================

__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: detection
eval_spatial_size: [1088, 1920]
output_dir: ./outputs/sovereign_v29_stage1_pure_rgb_dinov3_distill

DEIM:
  backbone: HGNetv2
  use_scene_gate: False         # 纯 RGB 阶段不使用多模态几何门控
  use_internal_sahi: False
  use_internal_tta: False
  num_classes: 12
  num_queries: 300
  use_dinov3_distill: True      # 开启 Meta DINOv3-ViT-Large 语义特征蒸馏
  dinov3_teacher_path: "ckpts/dinov3/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
  distill_cos_weight: 1.0
  distill_gram_weight: 0.5
  distill_downsample_scale: 0.5 # 下采样至 544x960，显存仅占 ~1.8GB

HGNetv2:
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True
  pretrained: False
  local_model_dir: weight/hgnetv2/

DEIMCriterion:
  weight_dict:
    loss_vfl: 1.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25
    loss_ddf: 1.5
    loss_distill: 1.0           # DINOv3 教师语义空间特征蒸馏权重
  losses: ['vfl', 'boxes', 'local']
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*dinov3_distiller).*$'
      lr: 0.0001                # 蒸馏投影层 1e-4 快速适应
    -
      params: '^(?=.*backbone)(?!.*norm|.*dinov3_distiller).*$'
      lr: 0.000005              # 骨干网络微调 5e-6 稳定适应
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
    -
      params: '^(?=.*(?:score_head|class_embed)).*$'
      lr: 0.00025               # 分类头高学习率 2.5e-4，迅速激活 12 类判决
  lr: 0.0001                   # 解码器主体 1e-4
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 12                     # 阶段一：12 轮快速建立纯 RGB 强表征与分类置信度
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 50
flat_epoch: 8                   # 前 8 轮平原期充分学习特征与分类
no_aug_epoch: 2                 # 后 2 轮关停增广做纯净退火

accum_steps: 1                  # 满血单步反向传播，彻底杜绝 micro-batch 分割与显存毛刺
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 5           # 单卡 5 张，实测峰值显存 25.5~26.5 GB (82% 满负荷，极限安全不 OOM)
  num_workers: 6
  persistent_workers: True
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1088, 1920]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 10
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1920
    base_size_repeat: ~
    stop_epoch: 10
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 5           # 验证集 batch size 5
  num_workers: 6
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1088, 1920]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
