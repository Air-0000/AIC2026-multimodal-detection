# =============================================================================
# DEIM-D-FINE-X 终极大融合主战攻坚模型 (Sovereign Multimodal Distillation)
# NVIDIA RTX PRO 6000 Blackwell Server Edition (96GB VRAM) 专享
# -----------------------------------------------------------------------------
# 架构配置:
#   - Student: HGNetv2-B5 (RGB) + ModalityStem (2ch IR) + DCDA + 3D-Lift + DOG
#     * Ch 0-2: Visible RGB 原彩图像
#     * Ch 3:   train_aligned_ir (3阶段高精亚像素仿射+ECC+光流对齐)
#     * Ch 4:   train_lbg_ir (31x31 中值 Top-Hat 局部背景抑制热源流)
#     * Ch 5:   16-bit 真实毫米物理深度图 (0-19999mm)
#   - Teacher: Pure RGB 56.71% 历史最高单模态模型 (puremal_refine_giou35, 冻结)
#   - Distillation:
#     * Logits KD: KL Divergence (T=2.0, w=1.2)
#     * DDF Bounding Box KD: KL Divergence on corner distributions (T=2.0, w=0.6)
#   - 极速流式管线:
#     * 全模态挂载 /dev/shm 内存盘 (0ms 物理读取延迟)
#     * num_workers: 16 (激活 208 核 CPU 并行池)
#     * persistent_workers: True (消除 Epoch 边界重建顿挫)
#     * pin_memory: True (DMA 显存异步锁页拷贝)
#     * prefetch_factor: 4
#   - 起点热启:
#     * 预训练起点: outputs/deim_hgnetv2_x_aic_dog_mm/best_stg1.pth (56.18% AP 成果)
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: distill
teacher_cfg: configs/deimv2/deim_hgnetv2_x_aic_puremal_refine_giou35.yml
teacher_weight: outputs/deim_hgnetv2_x_aic_puremal_refine_giou35/best_stg1.pth
kd_temp: 2.0
kd_cls_w: 1.2
kd_box_w: 0.6
kd_conf_thresh: 0.25

output_dir: ./outputs/deim_hgnetv2_x_aic_sovereign_distill_rtx6000

DEIM:
  backbone: HGNetv2MultiModal

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 8 / 16
  fusion: cssa
  use_dcda: True          # 固化 DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 固化 3D 物理空间坐标升维
  use_dog: True           # 固化 DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 架构端: 视差双边抗混叠池化模块
  stem_base: 64
  ir_drop_prob: 0.10
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

optimizer:
  params:
    -
      params: '^(?=.*backbone\.(?:ir_|occlusion_|coord_|ir_align))'
      lr: 0.00015
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*ir_)(?!.*occlusion_)(?!.*coord_)(?!.*ir_align).*$'
      lr: 0.0000015
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00015
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 36
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 50
flat_epoch: 12000
no_aug_epoch: 4

accum_steps: 1
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 16
  num_workers: 16
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True       # 1D 导向去条纹算法 (消除高频列条纹非均匀噪声, 降噪29.7%保锐度96%)
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [2, 18]
    stop_epoch: 32
    copyblend_epochs: [2, 32]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  num_workers: 8
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 100
lr_warmup_scheduler:
  warmup_duration: 0
