# Step 3 -- [5] Collaborating Vision / Depth / Thermal (NeurIPS 2025 D&B)
# RGB+heat share one DINOv3 stem (in_chans=4); depth has its own stem; the three
# feature streams interact through cross-modal attention at each scale. Depth
# carries geometry, IR carries thermal cues, RGB carries appearance -- kept
# orthogonal at the feature level.
#
# Requires depth preprocessing first:
#   conda run -n deimv2 python prep_depth.py
__include__: [
  'deimv2_dinov3_l_aic.yml',
]

output_dir: ./outputs/deimv2_dinov3_l_aic_step3_trimodal

DEIM:
  backbone: DINOv3STAsTriModal

DINOv3STAsTriModal:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  embed_dim: 384
  num_heads: 6
  patch_size: 16
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.5

# multimodal dataset: RGB(3) + heat(1) + depth(1) = 5 channels
train_dataloader:
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_depth/train/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

val_dataloader:
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_depth/valid/images
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
