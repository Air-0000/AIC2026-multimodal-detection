__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# 5ch (RGB + heat-residual IR + depth) model evaluated on LLVIP (OOD).
# Same architecture as deimv2_dinov3_l_aic_rdttrack_heat.yml so its checkpoint
# loads via -r.
# CAVEAT: LLVIP ships rgb/ir but NO depth, so the depth channel is null
# (all-black). The 5ch model saw real depth in 85% of training steps, hence this
# score is a LOWER bound for the 5ch recipe on LLVIP.
# Run: python train.py -c <this> -r outputs/deimv2_dinov3_l_aic_rdttrack_heat/best_stg2.pth --test-only
output_dir: ./outputs/deimv2_dinov3_l_aic_rdttrack_heat_llvip_noir

DEIM:
  backbone: DINOv3STAsRDTTrack

DINOv3STAsRDTTrack:
  name: dinov3_vits16
  weights_path: /home/constant/CodeBuddy/Dev/AIC/deimv2_dinov3_l_coco.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  unfreeze_rgb_stages: 0

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## Keep train def identical to the 5ch training config (unused in --test-only).
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 8

  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [4, 34]
    stop_epoch: 60
    copyblend_epochs: [4, 60]
    base_size_repeat: 3

## LLVIP as the (test-only) evaluation set: rgb + heat residual + NULL depth.
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/LLVIP/rgb
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/LLVIP_ir_black
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/LLVIP_depth_null
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/LLVIP/instances_llvip.json
    n_channels: 5
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [512, 512]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 4

DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
