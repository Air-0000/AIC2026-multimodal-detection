# =============================================================================
# DEIM-D-FINE-X 多模态 v1 (HGNetv2-B5 双干 + IR 注入) -- AIC 12类
# -----------------------------------------------------------------------------
# 任务: 把 RDTTrack (ViT) 的多模态配方迁移到 D-FINE-X RGB 主线 (用户裁定方向)。
# 单变量对照: vs deim_hgnetv2_x_aic_obj2coco_ft (无 DCN 的 RGB 基线), 唯一变量
#   = HGNetv2MultiModal 的 IR 支路 (ModalityStem + CSSA 注入 + 零初始化残差)。
#   基座不用 dcng4 (dcn 与融合模块两个变量会混在一起)。
#
# 模块 (engine/backbone/hgnetv2_mm.py):
#   * RGB 主干 = stock HGNetv2-B5, 前向逐 stage 镜像 (含 dcn_res 钩子, 本配置不用)
#   * IR 支路  = ModalityStem (deleak 单通道, ir_in_chans=1) -> 1/8 & 1/16 特征
#                -> 1x1 proj 到 stage2/3 宽度 (512/1024)
#                -> CSSA (CSD, CVPR2023) 通道切换+空间注意力
#                -> 零初始化 1x1 残差加回  => step0 严格恒等于 RGB 基线 (已冒烟验证)
#   * IR modality dropout p=0.15 (RDTTrack 同款)
#
# 权重: -t ckpts/dfine_x_obj2coco_mm.pth (scripts/gen/prepare_dfine_x_for_hgnetv2_mm.py
#   把 backbone.* 重映射为 backbone.rgb_net.*, encoder/decoder 原样; IR 支路从零训)
#   分类头 80->12 由 _matched_state strict=False 自动重置 (同 RGB 线)。
#
# 数据: 6ch 缓存 (RGB3+heat1+raw_ir1+depth1, depth 通道被 backbone 忽略)。
#   缓存 = work_dir/cache (统一命名; 由 prep_deepir_cache.py 从 dataset/ 原始 + work_dir/deleak 重烤)。
#   IR 支路只吃 deleak 单通道 (work_dir/deleak, ir_in_chans=1); raw_ir/depth 已弃用。
#   transforms 照搬 l4u3 多模态配方 (RandomNight5ch p=0.5 日夜混合训练)。
#
# 优化器: IR 支路 (backbone\.ir_) 用头部 lr 2.5e-4 (从零训);
#   RGB 主干沿官方微调 2.5e-6; 其余同官方配方。
# 评测: 同目录 *_val_*.yml (day + 9 档 night), gen 脚本生成。
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',   # HGNetv2-B5 + HybridEncoder + DFINETransformer
  '../dataset/aic_detection.yml',             # AIC 12类 (类别数; 数据集被下方覆写)
]

output_dir: ./outputs/deim_hgnetv2_x_aic_obj2coco_ft_dcnmm

DEIM:
  backbone: HGNetv2MultiModal

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 1          # 仅 deleak 热图 (缓存通道 3), raw_ir/depth 已弃用
  inject_stages: [2, 3]   # stride 8 / 16, 通道 512 / 1024
  fusion: cssa
  stem_base: 64
  ir_drop_prob: 0.15
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True        # stage1 ImageNet 主干 (tuning 加载后随即被 obj2coco 覆盖)

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

## 优化器: IR 支路从零训 -> 头部 lr; RGB 主干官方微调 lr
## (框架按 pattern 全量收集非首匹配, 各组正则必须互斥: backbone 组显式排除 ir_)
optimizer:
  params:
    -
      params: '^(?=.*backbone\.ir_)'
      lr: 0.00025
    -
      params: '^(?=.*backbone)(?!.*norm|bn)(?!.*ir_).*$'
      lr: 0.0000025
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

## 微调节奏 (与 RGB 线 obj2coco_ft 50ep 配方一致)
epoches: 50
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 100
flat_epoch: 12000
no_aug_epoch: 4

## batch: 16 = micro8 x accum2 (CNN 主干 + 小 IR stem, 显存余量大于 ViT 线)
accum_steps: 2

train_dataloader:
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModalCached
    cache_img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/cache/train
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deleak/images
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deleak/images
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.005, 0.45], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [3, 25]
    stop_epoch: 46
    copyblend_epochs: [3, 46]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deleak/valid
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deleak/valid
    depth_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/depth
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False

ema:
  warmups: 1000
lr_warmup_scheduler:
  warmup_duration: 0
