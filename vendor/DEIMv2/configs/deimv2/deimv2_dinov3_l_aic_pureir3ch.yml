__include__: [
  '../dataset/aic_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

# =============================================================================
# PURE-INFRARED 2ch DIAGNOSTIC  (heat residual + aligned raw IR, NO RGB)
# =============================================================================
# Question: how much STANDALONE detection signal does the IR modality carry?
#
# Prior data point: deimv2_dinov3_l_heat (heat saved as 3ch pseudo-RGB and run
# through the standard RGB pipeline) = 0.029 mAP on AIC val. That run entangled
# the modality with RGB-style augmentation and a 3ch backbone.
#
# This run isolates the modality with the dedicated PureIR backbone and a 2ch
# IR input:
#   ch0 = heat residual  max(IR_aligned - RGB_gray, 0)  -> the heat source
#   ch1 = aligned raw IR              -> cold targets / edges, the structure the
#                                        residual throws away
#
# Backbone: DINOv3STAsPureIR, patch_embed initialised from the DINOv3 pretrain
# (3->2 mean-repeat) so the IR stream inherits natural-image priors.
#
# Read-out: if this lands well above 0.029, thickening the IR stem (2ch input +
# more capacity) inside the 5ch RDTTrack is justified. If it stays ~0, IR is
# weak standalone and the 5ch night gains come from context, not IR semantics.
output_dir: ./outputs/deimv2_dinov3_l_aic_pureir3ch

DEIM:
  backbone: DINOv3STAsPureIR

DINOv3STAsPureIR:
  name: dinov3_vits16
  weights_path: ./ckpts/deimv2_l_coco/dinov3_vits16_stem.pth
  interaction_indexes: [5, 8, 11]
  conv_inplane: 32
  hidden_dim: 224
  ir_in_chans: 3

HybridEncoder:
  in_channels: [224, 224, 224]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  hidden_dim: 224
  num_layers: 4
  eval_idx: -1
  dim_feedforward: 1792

## DEIM LR-Scheduler
epoches: 68
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 34
no_aug_epoch: 8

## Optimizer
optimizer:
  type: AdamW
  params:
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0000125
      weight_decay: 0.
    -
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## IR-only dataset: modality=ir -> x = [heat(1), raw_ir(1), deleak(1)]  (3 channels)
## 相对 pureir2ch (best mAP 0.2449) 的唯一改动: 第三路 de-leaked IR + ir_in_chans 2->3
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/images
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/images
    deleak_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared_deleak
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    modality: ir
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  total_batch_size: 12
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_heat/valid
    raw_ir_folder: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_ir/valid
    deleak_ir_folder: /home/constant/CodeBuddy/Dev/AIC/dataset/train/infrared_deleak
    ann_file: /home/constant/CodeBuddy/Dev/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    modality: ir
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  total_batch_size: 16

## DEIM Loss
DEIMCriterion:
  matcher:
    matcher_change_epoch: 50
