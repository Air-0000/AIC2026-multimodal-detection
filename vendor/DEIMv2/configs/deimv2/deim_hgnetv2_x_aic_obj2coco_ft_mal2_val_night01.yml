__include__: [
  'deim_hgnetv2_x_aic_obj2coco_ft_mal2.yml',
  '../dataset/aic_detection_night01.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_obj2coco_ft_mal2_val_night01

# ops 覆写: aic_detection*.yml 的 ops:None 会让 PIL 直进 collate 崩
val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: "float32", scale: True}
