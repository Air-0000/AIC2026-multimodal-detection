# =============================================================================
# DEIM-D-FINE-X 异构双流 (HGNetv2-B5 CNN + DAv2 ViT) -- 物理对齐+局部背景抑制强化版
# NVIDIA RTX PRO 6000 Blackwell Server Edition (96GB VRAM) 专享版
# -----------------------------------------------------------------------------
# 模态输入规范:
#   - RGB (3ch): 原彩图像
#   - IR Ch1: work_dir/train_aligned_ir (3阶段高精度仿射+ECC+光流对齐)
#   - IR Ch2: work_dir/train_lbg_ir (31x31 中值 Top-Hat 局部背景抑制热源流)
#   - ViT: Depth Anything v2 ViT-S 深度几何先验
# -----------------------------------------------------------------------------
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_vit_dualstream_aligned_lbg_rtx6000

DEIM:
  backbone: HGNetv2ViTDualStream

HGNetv2ViTDualStream:
  name: B5
  return_idx: [1, 2, 3]
  ir_in_chans: 2
  stem_base: 64
  ir_drop_prob: 0.15
  depth_drop_prob: 0.15
  vit_encoder: 'vits'
  vit_ckpt_path: '/root/autodl-tmp/AIC/work_dir/da2_weights/depth_anything_v2_vits.pth'
  vit_embed_dim: 384
  vit_input_size: 518
  sub_dim: 96
  unfreeze_vit_blocks: 0        # Stage 1: 0; 12 epoch后可解冻顶层 4 层
  llrd_top_lr: 0.00002
  llrd_decay: 0.85
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: True

HybridEncoder:
  csp_type: csp

DFINETransformer:
  activation: relu
  mlp_act: relu

optimizer:
  params:
    -
      params: '^(?=.*backbone\.(?:c2v_|v2c_|disentangle_|fusion_|ir_|vit_projs))'
      lr: 0.00025
    -
      params: '^(?=.*backbone\.rgb_net)(?!.*norm|bn).*$'
      lr: 0.0000025
    -
      params: '^(?=.*backbone\.vit\.)'
      lr: 0.00002
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 72
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 100
flat_epoch: 12000
no_aug_epoch: 4

accum_steps: 1

train_dataloader:
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/images
    ir_folder: /root/autodl-tmp/AIC/work_dir/train_aligned_ir
    raw_ir_folder: /root/autodl-tmp/AIC/work_dir/train_lbg_ir
    depth_folder: /root/autodl-tmp/AIC/dataset/train/depth
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort5ch, p: 0.8, brightness: [0.6, 1.4], contrast: [0.5, 1.5], saturation: [0.5, 1.5], hue: [-0.1, 0.1]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomNight5ch, p: 0.5, level: [0.005, 0.45], photon_max: 70.0, read_sigma: 0.012, log_level: true, lamps: [1, 4]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  num_workers: 4
  collate_fn:
    type: BatchImageCollateFunction
    mixup_epochs: [3, 36]
    stop_epoch: 68
    copyblend_epochs: [3, 68]
    base_size_repeat: 1

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/images
    ir_folder: /root/autodl-tmp/AIC/work_dir/train_aligned_ir
    raw_ir_folder: /root/autodl-tmp/AIC/work_dir/train_lbg_ir
    depth_folder: /root/autodl-tmp/AIC/dataset/train/depth
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False

ema:
  warmups: 500
lr_warmup_scheduler:
  warmup_duration: 0
