# =============================================================================
# Sovereign V29 Ultra-High Resolution 2.5K (1440 x 2560) 纯净无偏退火收官
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100 32GB, GPU 1)
# 机制:
#   1. 挑战极致超清 1440 x 2560 空间尺度。
#   2. total_batch_size: 2 + accum_steps: 2 (有效等效 batch size 4，显存稳定 ~12.8GB，绝对零 OOM 风险)。
#   3. 超低学习率全局平滑退火 (8e-6 -> 1e-6)，在 2.5K 极密网格上精准压实边界框。
# =============================================================================

__include__: [
  './sovereign_v29_stage2c_pure_annealing.yml',
]

task: detection
eval_spatial_size: [1440, 2560]

accum_steps: 2
print_freq: 20

train_dataloader:
  total_batch_size: 2
  num_workers: 6
  persistent_workers: True
  pin_memory: True
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1440, 2560]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2560
    base_size_repeat: ~
    stop_epoch: 0

val_dataloader:
  total_batch_size: 2
  num_workers: 4
  drop_last: False
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1440, 2560]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
