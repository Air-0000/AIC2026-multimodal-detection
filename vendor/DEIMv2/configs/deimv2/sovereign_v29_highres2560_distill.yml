# =============================================================================
# Sovereign V29 Ultra-High Resolution 2.5K (1440 x 2560) 大模型特征蒸馏
# 硬件平台: 实验室科研服务器 ailab40 (Tesla V100 32GB, GPU 1)
# 机制:
#   1. 挑战极致超清 1440 x 2560 空间尺度 (严格 16:9，3,686,400 像素，原图 16 倍)。
#   2. total_batch_size: 2 + accum_steps: 2 (有效等效 batch size 4，显存稳定 ~12.8GB，绝对零 OOM 风险)。
#   3. 在 0.556 历史最强底座上进行 2.5K 超清亚像素多模态语义提纯。
# =============================================================================

__include__: [
  './sovereign_v29_cycle2_stage1_distill.yml',
]

task: detection
eval_spatial_size: [1440, 2560]

accum_steps: 2
print_freq: 20

train_dataloader:
  total_batch_size: 2
  num_workers: 6
  persistent_workers: True
  pin_memory: True
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomTriStateIllumination, p: 0.6, bright_range: [0.01, 0.35], boost_ratio: 0.5, gamma: 0.7, target_mean: 0.45}
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1440, 2560]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 4
        ops: ['RandomTriStateIllumination', 'RandomPhotometricDistort5ch', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2560
    base_size_repeat: ~
    stop_epoch: 4

val_dataloader:
  total_batch_size: 2
  num_workers: 4
  drop_last: False
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1440, 2560]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
