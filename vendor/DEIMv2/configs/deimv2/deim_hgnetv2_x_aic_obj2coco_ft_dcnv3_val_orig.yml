__include__: [
  'deim_hgnetv2_x_aic_obj2coco_ft_dcnv3.yml',
  '../dataset/aic_detection.yml',
]

output_dir: ./outputs/deim_hgnetv2_x_aic_obj2coco_ft_dcnv3_val_orig

# 本文件 body 键覆盖 __include__; aic_detection*.yml 的 ops:None 会让 PIL 直进
# collate 崩 ("Image object is not subscriptable"), 这里再覆写一次
val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: "float32", scale: True}
