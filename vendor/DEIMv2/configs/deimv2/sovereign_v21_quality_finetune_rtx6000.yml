# =============================================================================
# Sovereign V21-Quality-Master 进修微调配置 (RTX PRO 6000 Blackwell 96GB)
# 用户身份: 刘正阳 (liuzhengyang)
# -----------------------------------------------------------------------------
# 战术目标:
#   - 起点热启: Sovereign V21 Apex Soup (/root/autodl-tmp/AIC/weight/sovereign_v21_apex_soup_581.pth)
#   - 极小学习率: lr = 1e-5 (平滑微调，不破坏原有 58.12% 刚体几何与频域先验)
#   - 全新高质量真值:
#     * Train: instances_train_clean_quality.json (1,800 张, 16,170 框, 净增 +2,498 框)
#     * Val:   instances_val_clean_quality.json   (200 张,   1,757 框, 净增 +234 框)
#   - 硬件加速: /dev/shm 内存盘常驻 + 96GB 显存 Batch 16 秒级收敛 (6 Epochs ~5分钟)
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: detection
output_dir: ./outputs/sovereign_v21_quality_finetune_rtx6000

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: True       # 内生化 3 视角高清切片推理直通
  num_classes: 12

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2          # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]   # stride 16 / 32
  fusion: cssa
  use_dcda: True          # DCDA 深度引导形变视差对齐
  use_3d_lift: True       # 3D 物理空间坐标升维
  use_dog: True           # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True # 视差双边抗混叠池化模块
  use_shallow_edge_fuse: True # 浅层高频边缘注入
  use_rfgm_edge: True         # AAAI 频域相位残差补偿几何直通
  use_frontend_rfgm: True     # 前端幅度-相位暗光照度重构
  use_trunk_bridge: True      # Stage 0 -> Stage 1 微残差直通桥
  use_mixstyle: True          # MixStyle 跨域泛化
  mixstyle_p: 0.3
  pretrained_ir_stem: True
  return_idx: [0, 1, 2, 3]    # 释放 Stage 0 (P2, 160x160)
  stem_base: 64
  ir_drop_prob: 0.05
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: False

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]      # Level 0 (P3: 80x80) 与 Level 1 (P4: 40x40) 2D-SSM
  ssm_d_state: 16
  use_p2_guidance: True       # P2 (160x160) 跨尺度保峰高频残差引导
  p2_version: "v10_1"         # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控
  p2_dim: 128
  use_lfp: True               # LFP 低频引导净化
  use_pbd: True               # PBD 峰值-背景解耦 (Spatial-PBD)
  use_starconv: True          # StarConv 微软星形运算 (CVPR 2024)

DFINETransformer:
  use_snr_sharpen: True       # 暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5
  use_diam: True              # DIAM 可变形交互注意力

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25            # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_fcr: 0.2             # 傅里叶对比正则化损失
  losses: ['mal', 'boxes', 'local', 'fcr']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk).*$'
      lr: 0.000002
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 6
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 30
flat_epoch: 4
no_aug_epoch: 1

accum_steps: 1
print_freq: 20
checkpoint_freq: 1

train_dataloader:
  total_batch_size: 16
  num_workers: 8
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 4
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train_clean_quality.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05]}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 999
    mixup_epochs: [999, 999]

val_dataloader:
  type: DataLoader
  total_batch_size: 16
  num_workers: 8
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val_clean_quality.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 20
  decay: 0.9998
