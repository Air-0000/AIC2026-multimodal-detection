# =============================================================================
# Sovereign V29: Meta DINOv3-ViT-Large 微创在线特征蒸馏 (1152x2048 零畸变全分辨率)
# 黄金基底: Sovereign V23 Gold Checkpoint (88.83% mAP, 拒绝 V28 退化权重与任何污染)
# 教师模型: Meta 官方 DINOv3-ViT-Large (300M 参数, 1024 维特征, 冻结权重)
# 核心约束:
#   1. 严禁 Mosaic 拼接 / 缩小裁剪 (保证 1152x2048 物理视差与微小目标无损)
#   2. 严禁 测试集伪标签 / 严禁外部简单模型集成 (100% 竞赛合规单模型架构)
#   3. 采用余弦相似度 + Gram 矩阵拓扑拓扑关系双重损失引导学生 P4 特征空间对齐
# =============================================================================
__include__: [
  '../deim_dfine/dfine_hgnetv2_x_coco.yml',
  '../dataset/aic_detection.yml',
]

task: detection
eval_spatial_size: [1152, 2048]
output_dir: ./outputs/sovereign_v29_dinov3_distill_v23_base

DEIM:
  backbone: HGNetv2MultiModal
  use_scene_gate: True
  use_internal_sahi: False
  use_internal_tta: True        # 内生化左右对称翻转 TTA 引擎 (赛题第十一条严格合规单模型)
  num_classes: 12
  use_dinov3_distill: True      # 启用 Meta DINOv3 语义特征蒸馏
  dinov3_teacher_path: "weights/dinov3_large"
  distill_cos_weight: 1.0
  distill_gram_weight: 0.5

HGNetv2MultiModal:
  name: B5
  ir_in_chans: 2                # 2 通道 IR: Ch0=高精对齐 IR, Ch1=LBG 滤波 IR
  inject_stages: [2, 3]         # stride 16 / 32
  fusion: cssa
  use_dcda: True                # DCDA 深度引导形变视差对齐
  use_3d_lift: True             # 3D 物理空间坐标升维
  use_dog: True                 # DOG 深度阶跃遮挡隔离门控
  use_bilateral_pool: True       # 视差双边抗混叠池化模块
  use_shallow_edge_fuse: True   # 浅层高频边缘注入
  use_rfgm_edge: True           # AAAI 频域相位残差补偿几何直通
  use_frontend_rfgm: True       # 前端幅度-相位暗光照度重构
  use_trunk_bridge: True        # Stage 0 -> Stage 1 微残差直通桥
  use_mixstyle: False           # 纯净微调，关闭混淆
  pretrained_ir_stem: True
  return_idx: [0, 1, 2, 3]      # 释放 Stage 0 (P2, 288x512)
  stem_base: 64
  ir_drop_prob: 0.0             # 保持全部模态信息无损输入
  freeze_at: 0
  freeze_norm: True
  local_model_dir: weight/hgnetv2/
  pretrained: False

HybridEncoder:
  csp_type: csp
  use_ssm_levels: [0, 1]        # Level 0 与 Level 1 2D-SSM
  ssm_d_state: 16
  use_p2_guidance: True         # P2 跨尺度保峰高频残差引导
  p2_version: "v10_1"           # 终极强化版: MWHL Haar 小波 + 11x1 垂直条带 + CSR 空间门控
  p2_dim: 128
  use_lfp: True                 # LFP 低频引导净化
  use_pbd: True                 # PBD 峰值-背景解耦 (Spatial-PBD)
  use_starconv: True            # StarConv 微软星形运算 (CVPR 2024)

DFINETransformer:
  use_snr_sharpen: True         # 暗区信噪比感知分布锐化头
  snr_sharpen_alpha: 0.5
  use_diam: True                # DIAM 可变形交互注意力

DEIMCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 5.0
    loss_giou: 3.5
    loss_fgl: 0.25              # 强化精细几何局部定位权重
    loss_ddf: 1.5
    loss_cmal: 0.5              # 边缘相似度对齐损失
    loss_distill: 1.0           # DINOv3 教师语义蒸馏损失
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2.0
      cost_bbox: 5.0
      cost_giou: 3.5
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*dinov3_distiller).*$'
      lr: 0.00005               # 蒸馏投影头全新初始化，设 5e-5
    -
      params: '^(?=.*ir_align).*$'
      lr: 0.00005               # DCDA 视差分支 5e-5 持续微调
    -
      params: '^(?=.*backbone)(?!.*norm|.*ir_stem|.*ir_proj|.*ir_align|.*occlusion_gate|.*coord_lift|.*bilateral_pool|.*shallow_edge_fuse|.*frontend_rfgm|.*s0_to_p3_trunk|.*dinov3_distiller).*$'
      lr: 0.000001              # 骨干主体严格锁定 1e-6 (防灾难性遗忘铁律)
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001                   # 头部与解码器主体 1e-5 温和自适应
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 8                      # 8 轮精细微创手术退火
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 20
flat_epoch: 4                   # 前 4 轮恒定温和对齐
no_aug_epoch: 3                 # 后 3 轮关闭光度扰动，纯净特征对齐

accum_steps: 2                  # 有效 batch 8 (单卡显存安全)
print_freq: 10
checkpoint_freq: 2

train_dataloader:
  total_batch_size: 4
  num_workers: 4
  persistent_workers: True
  pin_memory: True
  prefetch_factor: 2
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    depth_read: raw16
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/train/annotations/instances_train.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        # 绝不使用 Mosaic / 绝不使用 ZoomOut / 绝不使用 IoUCrop
        # 保持 1152x2048 100% 原始超高清比例与微小目标几何结构
        - {type: RandomPhotometricDistort5ch, p: 0.5, brightness: [0.9, 1.1], contrast: [0.9, 1.1], saturation: [0.9, 1.1], hue: [-0.03, 0.03]}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1152, 2048]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: [5]
        ops: ['RandomPhotometricDistort5ch']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 2048
    base_size_repeat: ~
    mixup_prob: 0.0             # 严禁 mixup
    copyblend_prob: 0.0         # 严禁 copyblend
    stop_epoch: 0

val_dataloader:
  type: DataLoader
  total_batch_size: 4
  num_workers: 2
  pin_memory: True
  dataset:
    type: CocoDetectionMultiModal
    img_folder: /dev/shm/aic_cache/visible
    ir_folder: /dev/shm/aic_cache/train_aligned_ir
    raw_ir_folder: /dev/shm/aic_cache/train_lbg_ir
    depth_folder: /dev/shm/aic_cache/depth_p0
    depth_read: raw16
    destripe_ir: True
    ann_file: /root/autodl-tmp/AIC/work_dir/deimv2_dataset/valid/annotations/instances_val.json
    n_channels: 6
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1152, 2048]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406, 0.5, 0.5, 0.5], std: [0.229, 0.224, 0.225, 0.5, 0.5, 0.5]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  drop_last: False

ema:
  warmups: 10
  decay: 0.9998
