# AIC + online Copy-Paste (SAM mask lib, tail-class sqrt oversampling)
# ops copied verbatim from the merged dfine_hgnetv2_x_coco.yml pipeline;
# RandomCopyPaste inserted FIRST (original pixel coords, before Mosaic/Crop).
# Added to policy.ops so it follows the same stop regime (off ep0-1 / ep46+).
__include__: [
  '../dataset/aic_detection.yml',
]

train_dataloader:
  dataset:
    transforms:
      type: Compose
      mosaic_prob: 0.5
      ops:
        - type: RandomCopyPaste
          mask_lib: /home/constant/CodeBuddy/Dev/AIC/work_dir/sam/masklib/index.json
          prob: 0.5
          max_paste: 3
          scale_range: [0.5, 1.3]
          iou_thresh: 0.3
          sqrt_pow: 0.5
          min_score: 0.7
        - type: Mosaic
          output_size: 320
          rotation_range: 10
          translation_range: [0.1, 0.1]
          scaling_range: [0.5, 1.5]
          probability: 1.0
          fill_value: 0
          use_cache: True
          max_cached_images: 50
          random_pop: True
        - type: RandomPhotometricDistort
          p: 0.5
        - type: RandomZoomOut
          fill: 0
        - type: RandomIoUCrop
          p: 0.8
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: RandomHorizontalFlip
        - type: Resize
          size: [640, 640]
        - type: SanitizeBoundingBoxes
          min_size: 1
        - type: ConvertPILImage
          dtype: float32
          scale: True
        - type: ConvertBoxes
          fmt: cxcywh
          normalize: True
      policy:
        name: stop_epoch
        epoch: [2, 25, 46]
        ops: ['Mosaic', 'RandomCopyPaste', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
